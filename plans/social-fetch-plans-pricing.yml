metering:
  unit: credit
  detail: >-
    Most lookups cost 1 credit; heavier routes (e.g. Twitter/X search) cost more.
    Metered routes bill on successful lookup, INCLUDING not_found and private
    outcomes returned on HTTP 200. Cache hits (meta.cached:true) still charge.
    Failed validations and infrastructure errors (lookup_failed, 502/503) are not
    charged.
  expiration: none (pay-as-you-go credits do not expire)
  auto_top_up: available, enabled by default after first purchase
subscriptions:
  detail: >-
    Optional monthly (-8%) and annual (-15%) subscriptions add monthly credit
    resets (Starter 15k, Growth 50k, Scale 150k). Exact subscription list prices
    were not fully enumerated on the pricing page this pass.
alternative_payment:
  x402: USDC-on-Base walk-up pay-per-call, no API key or account required (see well-known/social-fetch-x402.json).
notes: >-
  No hard request rate limits on paid metered routes — "credits are the only
  limit". Enterprise/custom pricing is not advertised as a separate contact-us tier.
