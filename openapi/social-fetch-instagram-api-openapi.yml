                        caption: 'The closest people to you are often the last ones to celebrate your execution of God’s calling.


                          When you decide to stand up for Jesus, expect the room to get quiet. Your friends might distance themselves. Your family might think you’ve gone off the deep end. The people who knew your past will try to use it to disqualify your future.


                          But don’t miss this; Jesus experienced the exact same thing.


                          Mark 6:4 tells us that a prophet is honored everywhere except in his hometown and among his own relatives. If they rejected the Master, they will reject the servant. Do not let the silence of your circle muffle the voice of God in your life.


                          There is an entire world of strangers waiting on the other side of your obedience.


                          God doesn’t need your inner circle’s approval to bless your alignment. While people from your past are busy judging your transformation, thousands of strangers are waiting to hear the exact testimony that heals them.


                          Stop shrinking to keep comfortable people happy. Drop the video. Preach the Gospel. Let them talk.

