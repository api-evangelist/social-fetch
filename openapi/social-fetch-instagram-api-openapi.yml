  /v1/instagram/search/profiles:
    get:
      tags:
      - Instagram
      summary: Search Instagram profiles
      description: Search Instagram profiles by keyword.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 512
          description: Search query text for Instagram profiles.
        required: true
        description: Search query text for Instagram profiles.
        name: query
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque pagination cursor returned by a previous response.
        required: false
        description: Opaque pagination cursor returned by a previous response.
        name: cursor
        in: query
      responses:
        '200':
          description: Profile search results for the requested query.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      query:
                        type: string
                        description: Search query that was evaluated for this response.
                      profiles:
                        type: array
                        items:
                          type: object
                          properties:
                            platform:
                              type: string
                              enum:
                              - instagram
                              description: Social platform for this profile.
                            handle:
                              type: string
                              minLength: 1
                              description: Instagram username without the leading @.
                            displayName:
                              type:
                              - string
                              - 'null'
                              description: Public display name shown for the profile, when available.
                            bio:
                              type:
                              - string
                              - 'null'
                              description: Profile biography text, when available.
                            avatarUrl:
                              type:
                              - string
                              - 'null'
                              description: Profile image URL for the profile, when available.
                            verified:
                              type: boolean
                              description: Whether Instagram marks the profile as verified.
                            profileUrl:
                              type: string
                              minLength: 1
                              description: Canonical public Instagram profile URL.
                            privateAccount:
                              type: boolean
                              description: Whether the account is private.
                            platformUserId:
                              type: string
                              description: Instagram numeric user id as a string when available.
                            businessAccount:
                              type: boolean
                              description: Whether the account is a business account.
                            professionalAccount:
                              type: boolean
                              description: Whether the account is a professional/creator account.
                            categoryName:
                              type:
                              - string
                              - 'null'
                              description: Category label when Instagram provides one.
                            externalUrl:
                              type:
                              - string
                              - 'null'
                              description: Primary external link from the profile.
                            bioLinks:
                              type: array
                              items:
                                type: object
                                properties:
                                  title:
                                    type:
                                    - string
                                    - 'null'
                                    description: Link title shown on the profile.
                                  url:
                                    type: string
                                    minLength: 1
                                    description: Destination URL.
                                required:
                                - title
                                - url
                                description: A link from the Instagram profile bio.
                              description: Structured bio links when available.
                            matchedFrom:
                              type: string
                              enum:
                              - profile
                              - caption
                              description: Whether the match came from the profile page or from caption text.
                            metrics:
                              type: object
                              properties:
                                followers:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  description: Follower count when available.
                                following:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  description: Following count when available.
                                posts:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  description: Public post count when available.
                              required:
                              - followers
                              - following
                              - posts
                              description: Public profile metrics returned with this search result.
                          required:
