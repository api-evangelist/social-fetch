  /v1/instagram/profiles/{userId}/tagged-posts:
    get:
      tags:
      - Instagram
      summary: List Instagram tagged posts
      description: List Instagram posts a user is tagged in, by user id.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-agent-hints:
        disambiguation: This is the Tagged tab for a numeric Instagram user id, not the profile grid. Use GET /v1/instagram/profiles/{handle}/posts for the owner's own feed. Resolve a handle to a user id with GET /v1/instagram/profiles/{handle} or GET /v1/instagram/profiles/{userId}/basic.
        emptyResults: lookupStatus found with an empty posts array means this page of the Tagged tab has no public posts.
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges:
        - queryParam: hostMedia
          credits: 48
          when: boolean_true
          badge: +2 / asset
          label: +2 credits per hosted asset (up to 24)
        maxCredits: 49
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit base. With `hostMedia`, +2 credits per hosted asset (up to 24 assets, 49 credits max).
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\d+$
          description: Instagram numeric user id whose tagged posts should be listed.
        required: true
        description: Instagram numeric user id whose tagged posts should be listed.
        name: userId
        in: path
      - schema:
          type: string
          minLength: 1
          description: Opaque pagination cursor from a previous response.
        required: false
        description: Opaque pagination cursor from a previous response.
        name: cursor
        in: query
      - schema:
          type: boolean
          description: When true, hosts source media for 90 days and returns delivery URLs in each post's `hostedMedia`.
        required: false
        description: When true, hosts source media for 90 days and returns delivery URLs in each post's `hostedMedia`.
        name: hostMedia
        in: query
      responses:
        '200':
          description: Instagram tagged-tab posts for the requested user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - private
                        - not_found
                        description: 'Whether tagged posts could be listed for this user id. `found` includes empty tabs. Distinct `private` / `not_found` only when the provider signals those; unknown ids often look like `found` with `posts: []`.'
                      posts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              minLength: 1
                              description: Instagram media id for this item (vendor-defined composite id).
                            shortcode:
                              type: string
                              minLength: 1
                              description: Public shortcode used in the Instagram post URL.
                            mediaType:
                              type: string
                              enum:
                              - image
                              - video
                              - sidecar
                              - unknown
                              description: Normalized media type.
                            caption:
                              type:
                              - string
                              - 'null'
                              description: Caption text when Instagram provides one.
                            url:
                              type: string
                              minLength: 1
                              description: Canonical public Instagram URL for this media.
                            displayUrl:
                              type: string
                              description: Source-platform CDN URL for the primary display image when available. It can expire or be rejected outside the original retrieval context; it is not a SocialFetch-hosted asset. Omitted when no syntactically usable URL is available.
                            thumbnailUrl:
                              type: string
                              description: Source-platform CDN URL for the thumbnail or cover image when available. It can expire or be rejected outside the original retrieval context; it is not a SocialFetch-hosted asset.
                            videoUrl:
                              type: string
