  /v1/instagram/profiles/{userId}/basic:
    get:
      tags:
      - Instagram
      summary: Get Instagram basic profile
      description: Get a lightweight Instagram profile by numeric user ID when you already have the id.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^\d+$
          description: Instagram numeric user id to look up.
        required: true
        description: Instagram numeric user id to look up.
        name: userId
        in: path
      responses:
        '200':
          description: Instagram basic profile lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - private
                        - not_found
                        description: Whether the profile was resolved.
                      profile:
                        type:
                        - object
                        - 'null'
                        properties:
                          platform:
                            type: string
                            enum:
                            - instagram
                            description: Social platform for this profile.
                          handle:
                            type: string
                            description: Instagram username without the leading @.
                          displayName:
                            type:
                            - string
                            - 'null'
                            description: Public display name on the Instagram profile.
                          bio:
                            type:
                            - string
                            - 'null'
                            description: Profile biography text.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Best available square avatar image URL.
                          avatarUrlHd:
                            type:
                            - string
                            - 'null'
                            description: Higher-resolution avatar URL when available.
                          verified:
                            type: boolean
                            description: Whether Instagram marks the profile as verified.
                          profileUrl:
                            type: string
                            minLength: 1
                            description: Canonical public Instagram profile URL.
                          privateAccount:
                            type: boolean
                            description: Whether the account is private.
                          platformUserId:
                            type: string
                            description: Instagram numeric user id as a string.
                          businessAccount:
                            type: boolean
                            description: Whether the account is a business account.
                          professionalAccount:
                            type:
                            - boolean
                            - 'null'
                            description: Whether the account is a professional or creator account.
                          accountType:
                            type:
                            - integer
                            - 'null'
                            description: Instagram account type code when available.
                          categoryName:
                            type:
                            - string
                            - 'null'
                            description: Category label when Instagram provides one.
                          externalUrl:
                            type:
                            - string
                            - 'null'
                            description: Primary external link from the profile.
                        required:
                        - platform
                        - handle
                        - displayName
                        - bio
                        - avatarUrl
                        - verified
                        - profileUrl
                        - privateAccount
                        - platformUserId
                        description: Profile details when available.
                      metrics:
                        type:
                        - object
