                        mediaType: video
                        caption: "Il posto perfetto per chi vuole vivere il mare, un piatto alla volta \U0001F9AA\U0001F990\U0001F942\U0001F30A @scjabica_puntasecca è uno dei principali riferimenti a Punta Secca e nella provincia di Ragusa per i crudi di mare e per una cucina contemporanea interamente dedicata al pesce.\n\nIdeato e guidato dallo \U0001D5D6\U0001D5F5\U0001D5F2\U0001D5F3 \U0001D5DD\U0001D5FC\U0001D600\U0001D5F2\U0001D5FD\U0001D5F5 \U0001D5E0\U0001D5F6\U0001D5F0\U0001D5F6\U0001D5F2\U0001D5F9\U0001D5F6, uno dei più apprezzati del panorama gastronomico della Sicilia sud-orientale, noto per la sua identità culinaria legata a doppio filo al mare e della costa iblea.\n\nSituato sul lungomare di Punta Secca, borgo marinaro del comune di Santa Croce Camerina, dove si trova l’iconica \U0001D5D6\U0001D5EE\U0001D600\U0001D5EE \U0001D5F1\U0001D5F6 \U0001D5E0\U0001D5FC\U0001D5FB\U0001D601\U0001D5EE\U0001D5F9\U0001D5EF\U0001D5EE\U0001D5FB\U0001D5FC\n\n“\U0001D48F\U0001D486\U0001D494\U0001D494\U0001D496\U0001D48F \U0001D482\U0001D493\U0001D495\U0001D48A\U0001D487\U0001D48A\U0001D484\U0001D48A\U0001D490, \U0001D48F\U0001D486\U0001D494\U0001D494\U0001D496\U0001D48F\U0001D482 \U0001D482\U0001D48D\U0001D495\U0001D486\U0001D493\U0001D482\U0001D49B\U0001D48A\U0001D490\U0001D48F\U0001D486, \U0001D494\U0001D490\U0001D48D\U0001D490 \U0001D48A\U0001D48D \U0001D48E\U0001D482\U0001D493\U0001D486 \U0001D48F\U0001D486\U0001D48D \U0001D491\U0001D48A\U0001D482\U0001D495\U0001D495\U0001D490” è da questo pensiero che nasce Scjabica e tutta la filosofia dello chef @joseph_micieli \n\nDietro ogni pesce che entra nella cucina di Scjabica c’è uno studio profondo, quasi accademico, della materia prima: specie, stagionalità, provenienza, anatomia, tecniche di lavorazione e valorizzazione.\n\nUna \U0001D600\U0001D5F2\U0001D5F9\U0001D5F2\U0001D607\U0001D5F6\U0001D5FC\U0001D5FB\U0001D5F2 \U0001D5FE\U0001D602\U0001D5EE\U0001D600\U0001D5F6 \U0001D5FA\U0001D5EE\U0001D5FB\U0001D5F6\U0001D5EE\U0001D5F0\U0001D5EE\U0001D5F9\U0001D5F2 \U0001D5F1\U0001D5F2\U0001D5F9\U0001D5F9\U0001D5EE \U0001D5FA\U0001D5EE\U0001D601\U0001D5F2\U0001D5FF\U0001D5F6\U0001D5EE \U0001D5FD\U0001D5FF\U0001D5F6\U0001D5FA\U0001D5EE \U0001D5F2 \U0001D602\U0001D5FB\U0001D5EE \U0001D603\U0001D5EE\U0001D5F9\U0001D5FC\U0001D5FF\U0001D5F6\U0001D607\U0001D607\U0001D5EE\U0001D607\U0001D5F6\U0001D5FC\U0001D5FB\U0001D5F2 \U0001D5F1\U0001D5F2\U0001D5F9 \U0001D5FA\U0001D5EE\U0001D5FF\U0001D5F2 \U0001D5EE \U0001D7EF\U0001D7F2\U0001D7EC°, cercando di raccontarlo senza snaturarlo e portando nel piatto la massima espressione possibile della sua qualità.\n\nLa lavorazione dei crudi infatti è minima per lasciar parlare la purezza della materia prima, esaltata esclusivamente con sali marini, agrumi e olio EVO locale.\n\nUn lavoro che unisce alta ristorazione, tecnica, identità territoriale e una selezione estremamente rigorosa del pescato.\n\nLa location, un’antica “sardara” ristrutturata di fronte alle onde, offre un’atmosfera elegante e contemporanea con una terrazza panoramica perfetta per tramonti mozzafiato, la brezza marina e le luci della sera che si riflettono sul mare.\n\nFondali e Battigie, degustazione di crudo\nCarosello con 9 varietà di crudi di pesci, crostacei e molluschi, compresi spaghetti ai ricci di mare.\n“La rotta è segreta, ma la destinazione è certa - l’Emozione”\n\n\U0001F4CD\U0001D5E3\U0001D602\U0001D5FB\U0001D601\U0001D5EE \U0001D5E6\U0001D5F2\U0001D5F0\U0001D5F0\U0001D5EE - \U0001D5E5\U0001D5EE\U0001D5F4\U0001D602\U0001D600\U0001D5EE\n\n#CrudiDiMare #PuntaSecca #RistoranteDiPesce #JosephMicieli #PesceFreschissimo\n*Invito"
