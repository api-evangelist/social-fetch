  /v1/instagram/profiles/{handle}/reels:
    get:
      tags:
      - Instagram
      summary: List Instagram profile reels
      description: List Reels from one specific Instagram profile by handle (not a keyword search — use instagram.search.reels.list for that; not trending — use instagram.reels.trending.list for that).
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges:
        - queryParam: hostMedia
          credits: 48
          when: boolean_true
          badge: +2 / asset
          label: +2 credits per hosted asset (up to 24)
        maxCredits: 49
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit base. With `hostMedia`, +2 credits per hosted asset (up to 24 assets, 49 credits max).
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 2048
          description: Instagram handle whose reels should be listed.
        required: true
        description: Instagram handle whose reels should be listed.
        name: handle
        in: path
      - schema:
          type: string
          minLength: 1
          description: Opaque pagination cursor from a previous response.
        required: false
        description: Opaque pagination cursor from a previous response.
        name: cursor
        in: query
      - schema:
          type: boolean
          description: When true, hosts source media for 90 days and returns delivery URLs in each reel's `hostedMedia`.
        required: false
        description: When true, hosts source media for 90 days and returns delivery URLs in each reel's `hostedMedia`.
        name: hostMedia
        in: query
      responses:
        '200':
          description: Instagram reels for the requested profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether reels could be listed for this handle.
                      reels:
                        type: array
