                            - 'null'
                            description: Caption text.
                          createdAt:
                            type: string
                            format: date-time
                            description: When the media was taken or posted (ISO-8601).
                          accessibilityCaption:
                            type:
                            - string
                            - 'null'
                          isAd:
                            type: boolean
