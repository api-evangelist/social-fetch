                        caption: "@jmoffettmjm , better known as “Sugarfoot,” became one of the most respected drummers in music after spending decades playing alongside Michael Jackson during some of the biggest tours and performances in pop history. Moffett joined Jackson’s touring band in the late 1970s and later became a key part of tours like Bad, Dangerous, and HIStory, where every performance demanded near perfect timing because of how tightly choreographed the shows were. Michael once famously praised Sugarfoot by saying everyone in the band made mistakes sometimes except him, a quote that followed Moffett for years because of his reputation for precision and consistency under huge pressure. Even decades later, seeing him perform “Smooth Criminal” still stands out because those drum parts were a massive part of what gave Michael Jackson’s live shows their explosive energy and tension.\n\nFollow Us @howsongsweremade for more music content\n\n.\n. \n.\n.\n\n#music #songs #artists #explore #howsongsweremade"
