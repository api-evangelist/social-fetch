  /v1/instagram/profiles/{handle}/posts:
    get:
      tags:
      - Instagram
      summary: List Instagram profile posts
      description: List posts from an Instagram profile by handle.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges:
        - queryParam: hostMedia
          credits: 48
          when: boolean_true
          badge: +2 / asset
          label: +2 credits per hosted asset (up to 24)
        maxCredits: 49
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit base. With `hostMedia`, +2 credits per hosted asset (up to 24 assets, 49 credits max).
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 2048
          description: Instagram handle whose posts should be listed.
        required: true
        description: Instagram handle whose posts should be listed.
        name: handle
        in: path
      - schema:
          type: string
          minLength: 1
          description: Opaque pagination cursor from a previous response.
        required: false
        description: Opaque pagination cursor from a previous response.
        name: cursor
        in: query
      - schema:
          type: boolean
          description: When true, hosts source media for 90 days and returns delivery URLs in each post's `hostedMedia`.
        required: false
