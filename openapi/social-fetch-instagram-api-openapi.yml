                              description: Public shortcode used in the Instagram post URL.
                            mediaType:
                              type: string
                              enum:
                              - image
                              - video
                              - sidecar
                              - unknown
                              description: Normalized media type.
                            caption:
                              type:
                              - string
                              - 'null'
                              description: Caption text when Instagram provides one.
                            createdAt:
                              type: string
                              format: date-time
                              description: When the media was taken or posted (ISO-8601).
                            url:
                              type: string
                              minLength: 1
                              description: Canonical public Instagram URL for this media.
                            displayUrl:
                              type: string
                              description: Source-platform CDN URL for the primary display image when available. It can expire or be rejected outside the original retrieval context; it is not a SocialFetch-hosted asset. Omitted when no syntactically usable URL is available.
                            thumbnailUrl:
                              type: string
                              description: Source-platform CDN URL for the thumbnail or cover image when available. It can expire or be rejected outside the original retrieval context; it is not a SocialFetch-hosted asset.
                            videoUrl:
                              type: string
                              description: Source-platform CDN URL for the video when this item is a video and a usable URL is available. It can expire or be rejected outside the original retrieval context; it is not a SocialFetch-hosted asset. For durable hosted copies on this list route, pass `hostMedia=true`. For a single known post URL, `GET /v1/instagram/posts?downloadMedia=true` returns provider-hosted URLs in `downloads`.
                            likeCount:
