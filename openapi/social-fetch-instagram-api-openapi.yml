openapi: 3.2.0
info:
  title: Social Fetch Public Instagram API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Instagram
paths:
  /v1/instagram/profiles/{handle}:
    get:
      tags:
      - Instagram
      summary: Get Instagram profile
      description: Get a full Instagram profile by handle (bio, counts, and related fields).
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 2048
          description: Instagram handle to look up, with or without a leading @. A profile URL is also accepted.
        required: true
        description: Instagram handle to look up, with or without a leading @. A profile URL is also accepted.
        name: handle
        in: path
      responses:
        '200':
          description: Instagram profile lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - private
                        - not_found
                        description: Whether the profile was resolved.
                      profile:
                        type:
                        - object
                        - 'null'
                        properties:
                          platform:
                            type: string
                            enum:
                            - instagram
                            description: Social platform for this profile.
                          handle:
                            type: string
                            description: Instagram username without the leading @.
                          displayName:
                            type:
                            - string
                            - 'null'
                            description: Public display name on the Instagram profile.
                          bio:
                            type:
                            - string
                            - 'null'
                            description: Profile biography text.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Best available square avatar image URL.
                          avatarUrlHd:
                            type:
                            - string
                            - 'null'
                            description: Higher-resolution avatar URL when available.
                          verified:
                            type: boolean
                            description: Whether Instagram marks the profile as verified.
                          profileUrl:
                            type: string
                            minLength: 1
                            description: Canonical public Instagram profile URL.
                          privateAccount:
                            type: boolean
                            description: Whether the account is private.
                          platformUserId:
                            type: string
                            description: Instagram numeric user id as a string.
                          businessAccount:
                            type: boolean
                            description: Whether the account is a business account.
                          professionalAccount:
                            type: boolean
                            description: Whether the account is a professional/creator account.
                          categoryName:
                            type:
                            - string
                            - 'null'
                            description: Category label when Instagram provides one.
                          externalUrl:
                            type:
                            - string
                            - 'null'
                            description: Primary external link from the profile.
                          highlightReelCount:
                            type: integer
                            minimum: 0
                            description: Number of story highlights on the profile.
                          bioLinks:
                            type: array
                            items:
                              type: object
                              properties:
                                title:
                                  type:
                                  - string
                                  - 'null'
                                  description: Link title shown on the profile.
                                url:
                                  type: string
                                  minLength: 1
                                  description: Destination URL.
                              required:
                              - title
                              - url
                              description: A link from the Instagram profile bio.
                            description: Structured bio links when available.
                        required:
                        - platform
                        - handle
                        - displayName
                        - bio
                        - avatarUrl
                        - verified
                        - profileUrl
                        - privateAccount
                        description: Profile details when available.
                      metrics:
                        type:
                        - object
                        - 'null'
                        properties:
                          followers:
                            type: integer
                            minimum: 0
                            description: Follower count reported by Instagram.
                          following:
                            type: integer
                            minimum: 0
                            description: Following count reported by Instagram.
                          posts:
                            type: integer
                            minimum: 0
                            description: Total public posts count on the profile grid.
                        required:
                        - followers
                        - following
                        - posts
                        description: Profile metrics when available.
                      recentPosts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Instagram media id for this post (vendor-defined).
                            shortcode:
                              type: string
                              description: Public shortcode for the post URL.
                            mediaType:
                              type: string
                              enum:
                              - video
                              - image
                              - sidecar
                              - unknown
                              description: Normalized media type.
                            caption:
                              type:
                              - string
                              - 'null'
                              description: Post caption when available.
                            createdAt:
                              type: string
                              format: date-time
                              description: When the media was taken or posted (ISO-8601).
                            commentCount:
                              type: integer
                              minimum: 0
                              description: Comment count when available.
                            likeCount:
                              type: integer
                              minimum: 0
                              description: Like count when available.
                            videoViewCount:
                              type: integer
                              minimum: 0
                              description: Video view count for video posts when available.
                            displayUrl:
                              type: string
                              description: Primary display image URL.
                            thumbnailUrl:
                              type: string
                              description: Thumbnail image URL.
                            videoUrl:
                              type: string
                              description: Direct video URL when available.
                            dimensions:
                              type: object
                              properties:
                                width:
                                  type: integer
                                  minimum: 0
                                  description: Media width in pixels.
                                height:
                                  type: integer
                                  minimum: 0
                                  description: Media height in pixels.
                              required:
                              - width
                              - height
                              description: Width and height when available.
                          required:
                          - id
                          - shortcode
                          - mediaType
                          - caption
                          - createdAt
                          description: A recent post or reel from the profile grid.
                        description: Recent grid posts from the profile when available.
                      relatedProfiles:
                        type: array
                        items:
                          type: object
                          properties:
                            platformUserId:
                              type: string
                              description: Instagram user id for the account.
                            handle:
                              type: string
                              description: Instagram username.
                            displayName:
                              type:
                              - string
                              - 'null'
                              description: Display name.
                            avatarUrl:
                              type:
                              - string
                              - 'null'
                              description: Profile picture URL.
                            verified:
                              type: boolean
                              description: Whether the account is verified.
                            privateAccount:
                              type: boolean
                              description: Whether the account is private.
                          required:
                          - platformUserId
                          - handle
                          - displayName
                          - avatarUrl
                          - verified
                          - privateAccount
                          description: A suggested related Instagram account.
                        description: Suggested related accounts when available.
                    required:
                    - lookupStatus
                    - profile
                    - metrics
                    - recentPosts
                    - relatedProfiles
                    description: Endpoint-specific response payload.
