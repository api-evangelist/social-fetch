      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges:
        - queryParam: downloadMedia
          credits: 10
          when: boolean_true
          label: Hosted media download
        maxCredits: 11
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit base. With `downloadMedia`, Hosted media download. Up to 11 credits max.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: Link to the post or reel.
        required: true
        description: Link to the post or reel.
        name: url
        in: query
      - schema:
          type: string
          description: Optional ISO 3166-1 country code for request routing.
        required: false
        description: Optional ISO 3166-1 country code for request routing.
        name: region
        in: query
      - schema:
          type: boolean
          description: When true, returns a smaller response with fewer fields.
        required: false
        description: When true, returns a smaller response with fewer fields.
        name: trim
        in: query
      - schema:
          type: boolean
          description: When true, asks the upstream provider to download media and return provider-hosted URLs in `downloads` (not SocialFetch-owned storage). Adds 10 credits when media is found (11 total including the base lookup); when no media is returned the base lookup credit still applies.
        required: false
        description: When true, asks the upstream provider to download media and return provider-hosted URLs in `downloads` (not SocialFetch-owned storage). Adds 10 credits when media is found (11 total including the base lookup); when no media is returned the base lookup credit still applies.
        name: downloadMedia
        in: query
