      operationId: getV1TwitterProfilesByHandle
      x-operation-id-source: derived
  /v1/twitter/profiles/{handle}/tweets:
    get:
      tags:
      - Twitter
      summary: List Twitter profile tweets
      description: List tweets from an X profile by handle.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 2
        surcharges: []
        maxCredits: 2
        normalizationFailureCredits: 2
      x-socialfetch-credits-pricing: 2 credits per successful request.
      parameters:
      - schema:
          type: string
          description: X handle to look up, with or without a leading @.
        required: true
        description: X handle to look up, with or without a leading @.
        name: handle
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          description: 'Page size (maximum 100). Default: 40.'
        required: false
        description: 'Page size (maximum 100). Default: 40.'
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque pagination cursor returned by a previous response.
        required: false
        description: Opaque pagination cursor returned by a previous response.
        name: cursor
        in: query
      - schema:
          type: boolean
          description: 'Include reply tweets in the returned list. Default: false.'
        required: false
        description: 'Include reply tweets in the returned list. Default: false.'
        name: includeReplies
        in: query
      - schema:
          type: boolean
          description: 'Include pinned tweets on the first page. Default: false.'
        required: false
        description: 'Include pinned tweets on the first page. Default: false.'
        name: includePinned
        in: query
      responses:
        '200':
          description: Tweets for the requested profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether tweet data was returned for this handle.
                      profile:
                        type:
                        - object
                        - 'null'
                        properties:
                          platform:
                            type: string
                            enum:
                            - twitter
                            description: Social platform for this profile.
                          handle:
                            type: string
                            minLength: 1
                            description: Screen name without @.
                          displayName:
                            type:
                            - string
                            - 'null'
                            description: Display name for the profile.
                          bio:
                            type:
                            - string
                            - 'null'
                            description: Profile bio when reported by the upstream provider.
                          location:
                            type:
                            - string
                            - 'null'
                            description: Profile location when reported by the upstream provider.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Best available square avatar URL.
                          bannerUrl:
                            type:
                            - string
                            - 'null'
                            description: Profile banner image URL when available.
                          verified:
                            type: boolean
                            description: Legacy verified flag from X.
                          blueVerified:
                            type: boolean
                            description: Paid blue verification flag from X.
                          profileUrl:
                            type: string
                            minLength: 1
                            description: Canonical profile URL on x.com.
                          platformUserId:
                            type: string
                            description: Numeric user id as a string.
                        required:
                        - platform
                        - handle
                        - displayName
                        - bio
                        - location
                        - avatarUrl
                        - bannerUrl
                        - verified
                        - blueVerified
                        - profileUrl
                        description: Profile card derived from the first returned tweet when available; null when not found or when no tweet rows include author data.
                      tweets:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              minLength: 1
                              description: Tweet id.
                            url:
                              type:
                              - string
                              - 'null'
                              description: Canonical public URL for the tweet when available.
                            text:
                              type: string
                              description: Full tweet text when available.
                            createdAt:
                              type: string
                              format: date-time
                              description: Creation time (ISO-8601).
                            createdAtLabel:
                              type:
                              - string
                              - 'null'
                              description: Human-readable creation timestamp string when available.
                            language:
                              type:
                              - string
                              - 'null'
                              description: Language code for the tweet when available.
                            conversationId:
                              type:
                              - string
                              - 'null'
                              minLength: 1
                              description: Conversation identifier when supplied.
                            inReplyToStatusId:
                              type:
                              - string
                              - 'null'
                              minLength: 1
                              description: Parent post identifier when this post is a reply.
                            quotedStatusId:
                              type:
                              - string
                              - 'null'
                              minLength: 1
                              description: Quoted post identifier when this post quotes another.
                            retweetTweetId:
                              type:
                              - string
                              - 'null'
                              minLength: 1
                              description: Original post identifier when this post is an engagement repost.
                            author:
                              type:
                              - object
                              - 'null'
                              properties:
                                handle:
                                  type: string
                                  minLength: 1
                                  description: Author handle without the leading @.
                                displayName:
                                  type:
                                  - string
                                  - 'null'
                                  description: Display name shown for the author.
                                avatarUrl:
                                  type:
                                  - string
                                  - 'null'
                                  description: Profile image URL for the author when available.
                                profileUrl:
                                  type:
                                  - string
                                  - 'null'
                                  description: Canonical public profile URL for the author when available.
                                verified:
                                  type: boolean
                                  description: Whether the author has legacy verification on X.
                                blueVerified:
                                  type: boolean
                                  description: Whether the author has paid blue verification on X.
                                platformUserId:
                                  type: string
                                  description: Numeric X user id for the author as a string.
                              required:
                              - handle
                              - displayName
                              - avatarUrl
                              - profileUrl
                              - verified
                              - blueVerified
                              description: Author metadata for the tweet when available.
                            metrics:
                              type: object
                              properties:
                                likes:
                                  type: integer
                                  minimum: 0
                                  description: Like count.
                                retweets:
                                  type: integer
                                  minimum: 0
                                  description: Retweet count.
                                replies:
                                  type: integer
                                  minimum: 0
                                  description: Reply count.
                                quotes:
                                  type: integer
                                  minimum: 0
                                  description: Quote count.
                                views:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  description: View count when available.
                                bookmarkCount:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  description: Bookmark count when available.
                              required:
                              - likes
                              - retweets
                              - replies
                              - quotes
                              - views
                              - bookmarkCount
                              description: Engagement metrics for a tweet.
                            media:
                              type: array
                              items:
                                type: object
                                properties:
                                  url:
                                    type: string
                                    minLength: 1
                                    description: Direct media URL when available.
                                  type:
                                    type: string
                                    enum:
                                    - photo
                                    - video
                                    description: Media type when Social Fetch can classify it confidently.
                                  thumbnailUrl:
                                    type: string
                                    minLength: 1
                                    description: Poster or thumbnail URL for video media when distinguishable.
                                  contentType:
                                    type: string
                                    minLength: 1
                                    description: MIME type reported for streamed media.
                                  bitrate:
                                    type: integer
                                    minimum: 0
                                    description: Bitrate in bits per second when supplied for streamed media.
                                  width:
                                    type: integer
                                    minimum: 0
                                    description: Width in pixels when available.
                                  height:
                                    type: integer
                                    minimum: 0
                                    description: Height in pixels when available.
                                required:
                                - url
                                - type
                                description: Media attachment on a tweet.
                              description: Media attachments returned for the tweet.
                            expandedUrl:
                              type:
                              - string
