openapi: 3.2.0
info:
  title: Social Fetch Public Twitter API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Twitter
paths:
  /v1/twitter/profiles/{handle}:
    get:
      tags:
      - Twitter
      summary: Get Twitter profile
      description: Get an X (Twitter) profile by handle.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          description: X handle to look up, with or without a leading @.
        required: true
        description: X handle to look up, with or without a leading @.
        name: handle
        in: path
      responses:
        '200':
          description: Twitter profile lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - private
                        - not_found
                        description: Whether the profile was resolved.
                      profile:
                        type:
                        - object
                        - 'null'
                        properties:
                          platform:
                            type: string
                            enum:
                            - twitter
                            description: Social platform for this profile.
                          handle:
                            type: string
                            description: X screen name (handle) without the leading @.
                          displayName:
                            type:
                            - string
                            - 'null'
                            description: Display name shown on the profile.
                          bio:
                            type:
                            - string
                            - 'null'
                            description: Profile biography text.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Best available square avatar image URL.
                          bannerUrl:
                            type:
                            - string
                            - 'null'
                            description: Profile banner image URL when available.
                          verified:
                            type: boolean
                            description: Whether X marks the profile with legacy verification (not necessarily paid blue).
                          blueVerified:
                            type: boolean
                            description: Whether the account has X blue (paid) verification.
                          profileUrl:
                            type: string
                            minLength: 1
                            description: Canonical public profile URL on x.com.
                          privateAccount:
                            type: boolean
                            description: Whether the account is protected (private).
                          platformUserId:
                            type: string
                            description: Numeric X user id (`rest_id`) as a string.
                          accountCreatedAt:
                            type: string
                            format: date-time
                            description: Account creation time (ISO-8601) when derivable.
                          location:
                            type:
                            - string
                            - 'null'
                            description: Location string from the profile when provided.
                          website:
                            type:
                            - string
                            - 'null'
                            description: Primary outbound link (expanded URL) from the profile.
                          pinnedTweetId:
                            type: string
                            description: Pinned tweet id when X exposes one.
                          verificationInfo:
                            type: object
                            properties:
                              isIdentityVerified:
                                type: boolean
                                description: Whether X marks the account as identity-verified.
                              verifiedSinceMsec:
                                type: string
                                description: When verification became effective, as milliseconds since epoch (string from X).
                              reason:
                                type: object
                                properties:
                                  text:
                                    type: string
                                    description: Human-readable verification reason text from X.
                                  entities:
                                    type: array
                                    items: {}
                                    description: Inline entity metadata for the reason text (vendor-defined).
                                description: Verification reason payload when X provides it.
                            required:
                            - isIdentityVerified
                            description: Structured verification metadata from X.
                          tipJar:
                            type: object
                            properties:
                              isEnabled:
                                type: boolean
                                description: Whether the X tip jar is enabled.
                              handles:
                                type: object
                                properties:
                                  bandcamp:
                                    type: string
                                    description: Bandcamp handle from tip jar.
                                  bitcoin:
                                    type: string
                                    description: Bitcoin address or handle.
                                  cashApp:
                                    type: string
                                    description: Cash App handle.
                                  ethereum:
                                    type: string
                                    description: Ethereum address or handle.
                                  goFundMe:
                                    type: string
                                    description: GoFundMe handle.
                                  patreon:
                                    type: string
                                    description: Patreon handle.
                                  payPal:
                                    type: string
                                    description: PayPal handle.
                                  venmo:
                                    type: string
                                    description: Venmo handle.
                                description: Per-service handles when any are present.
                            required:
                            - isEnabled
                            description: Tip jar configuration when present.
                          highlights:
                            type: object
                            properties:
                              canHighlightTweets:
                                type: boolean
                                description: Whether the account may highlight tweets on the profile.
                              highlightedTweetCount:
                                type: integer
                                minimum: 0
                                description: Count of highlighted tweets when reported by X.
                            required:
                            - canHighlightTweets
                            - highlightedTweetCount
                            description: Tweet highlights metadata when present.
                          businessAccount:
                            type: object
                            additionalProperties: {}
                            description: Opaque business-account payload from X when non-empty (vendor-defined).
                          creatorSubscriptionsCount:
                            type: integer
                            minimum: 0
                            description: Creator subscriptions count when X reports it.
                          affiliateLabel:
                            type: object
                            properties:
                              description:
                                type: string
                                description: Affiliate or business label text shown on the profile.
                              badgeUrl:
                                type: string
                                description: Badge image URL when X provides one.
                              url:
                                type: string
                                description: Destination URL for the label link.
                            required:
                            - description
                            description: Affiliate or business label when X provides one.
                        required:
                        - platform
                        - handle
                        - displayName
                        - bio
                        - avatarUrl
                        - verified
                        - blueVerified
                        - profileUrl
                        - privateAccount
                        description: Profile details when available.
                      metrics:
                        type:
                        - object
                        - 'null'
                        properties:
                          followers:
                            type: integer
                            minimum: 0
                            description: Follower count from X.
                          following:
                            type: integer
                            minimum: 0
                            description: Following (friends) count from X.
                          tweets:
                            type: integer
                            minimum: 0
                            description: Total post (status) count from X.
                          favourites:
                            type: integer
                            minimum: 0
                            description: Total favourites (likes) count from X.
                          listedCount:
                            type: integer
                            minimum: 0
                            description: Listed count when X provides it.
                          mediaCount:
                            type: integer
                            minimum: 0
                            description: Media item count when X provides it.
                          fastFollowersCount:
                            type: integer
                            minimum: 0
                            description: Fast-followers count when X provides it.
                        required:
                        - followers
                        - following
                        - tweets
                        - favourites
                        description: Profile metrics when available.
                    required:
                    - lookupStatus
                    - profile
                    - metrics
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
              examples:
                found:
                  value:
                    data:
                      lookupStatus: found
                      profile:
                        platform: twitter
                        handle: elonmusk
                        displayName: Elon Musk
                        bio: https://t.co/dDtDyVssfm
                        avatarUrl: https://pbs.twimg.com/profile_images/2053244804520427520/m8mdWZCG_400x400.jpg
                        bannerUrl: https://pbs.twimg.com/profile_banners/44196397/1774145451
                        verified: false
                        blueVerified: true
                        profileUrl: https://x.com/elonmusk
                        privateAccount: false
                        platformUserId: '44196397'
                        accountCreatedAt: '2009-06-02T20:12:29.000Z'
                        location: null
                        website: null
                        pinnedTweetId: '2055294612751991090'
                        verificationInfo:
                          isIdentityVerified: false
                          verifiedSinceMsec: '-156836000000000'
                          reason:
                            text: This account is verified because it's an affiliate of @X on X. Learn more
                            entities:
                            - from_index: 54
                              ref:
                                url: https://twitter.com/X
                                url_type: ExternalUrl
                              to_index: 56
                            - from_index: 63
                              ref:
                                url: https://help.twitter.com/en/rules-and-policies/profile-labels
                                url_type: ExternalUrl
                              to_index: 73
                        tipJar:
                          isEnabled: false
                        highlights:
                          canHighlightTweets: true
                          highlightedTweetCount: 992
                        creatorSubscriptionsCount: 242
                        affiliateLabel:
                          description: X
                          badgeUrl: https://pbs.twimg.com/profile_images/1955359038532653056/OSHY3ewP_bigger.jpg
                          url: https://twitter.com/X
                      metrics:
                        followers: 239969577
                        following: 1332
                        tweets: 102641
                        favourites: 227794
                        listedCount: 169024
                        mediaCount: 4489
                        fastFollowersCount: 0
                    meta:
                      requestId: req_663e3c24-faae-4481-b8c0-5ea403d434ff
                      creditsCharged: 1
                      version: v1
                private:
                  value:
                    data:
                      lookupStatus: private
                      profile:
                        platform: twitter
                        handle: lukem1221
                        displayName: Luke
                        bio: null
                        avatarUrl: https://pbs.twimg.com/profile_images/1999456116619771904/rmqNgqiu_400x400.jpg
                        bannerUrl: null
                        verified: false
                        blueVerified: false
                        profileUrl: https://x.com/lukem1221
                        privateAccount: true
                        platformUserId: '761228485981528065'
                        accountCreatedAt: '2016-08-04T15:53:09.000Z'
                        location: null
                        website: https://www.voicegecko.io/
                        verificationInfo:
                          isIdentityVerified: false
                        tipJar:
                          isEnabled: false
                        highlights:
                          canHighlightTweets: false
                          highlightedTweetCount: 0
                        creatorSubscriptionsCount: 0
                      metrics:
                        followers: 115
                        following: 97
                        tweets: 47
                        favourites: 48
                        listedCount: 3
                        mediaCount: 5
                        fastFollowersCount: 0
                    meta:
                      requestId: req_01example
                      creditsCharged: 1
                      version: v1
                not_found:
                  value:
                    data:
                      lookupStatus: not_found
                      profile: null
                      metrics: null
                    meta:
                      requestId: req_01example
                      creditsCharged: 1
                      version: v1
        '400':
          description: Invalid handle or bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - bad_request
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: bad_request
                  message: Example message.
                  requestId: req_01example
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - unauthorized
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
