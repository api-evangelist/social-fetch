  /v1/web/ask:
    get:
      tags:
      - Web
      summary: Ask a question about a web page
      description: Ask a natural-language question about a specific web page and get an LLM-generated answer.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      x-socialfetch-agent-hints:
        emptyResults: '`lookupStatus: restricted` means bot/access protection blocked the fetch; `answer` is null.'
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 2083
          description: Web page URL to fetch.
        required: true
        description: Web page URL to fetch.
        name: url
