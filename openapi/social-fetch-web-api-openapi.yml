openapi: 3.2.0
info:
  title: Social Fetch Public Web API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Web
paths:
  /v1/web/search:
    get:
      tags:
      - Web
      summary: Search the web
      description: Search the public web and return ranked organic results with snippets.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 500
          description: Search query text to run against the public web.
        required: false
        description: Search query text to run against the public web.
        name: query
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 500
          description: Silent alias for query when query is omitted.
        required: false
        description: Silent alias for query when query is omitted.
        name: q
        in: query
      - schema:
          type: string
          description: ISO 3166-1 country code for localized results (e.g. US, GB, CA).
        required: false
        description: ISO 3166-1 country code for localized results (e.g. US, GB, CA).
        name: region
        in: query
      - schema:
          type: string
          enum:
          - last-hour
          - last-day
          - last-week
          - last-month
          - last-year
          description: Optional filter by when results were posted.
        required: false
        description: Optional filter by when results were posted.
        name: datePosted
        in: query
      - schema:
          type: integer
          minimum: 1
          description: 'Page number (1-based). Default: 1.'
        required: false
        description: 'Page number (1-based). Default: 1.'
        name: page
        in: query
      responses:
        '200':
          description: Ranked web search results for the requested query.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      query:
                        type: string
                        description: Search query that was executed.
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                              description: Result page title.
                            url:
                              type: string
                              format: uri
                              description: Result page URL.
                            content:
                              type: string
                              description: Relevant text snippet extracted from the result.
                          required:
                          - title
                          - url
                          - content
                          description: One ranked web search result.
                        description: Ranked search results.
                      page:
                        type: object
                        properties:
                          page:
                            type: integer
                            description: Current page number (1-based).
                            exclusiveMinimum: 0
                          hasMore:
                            type: boolean
                            description: Whether another page is available.
                          nextPage:
                            type:
                            - integer
                            - 'null'
                            description: Next page number when more pages exist; null on the last page.
                            exclusiveMinimum: 0
                        required:
                        - page
                        - hasMore
                        - nextPage
                        description: Best-effort pagination state. The upstream search provider reports no result total and no explicit end-of-results signal, so `hasMore` is true when this page came back full.
                    required:
                    - query
                    - results
                    - page
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
              examples:
                results:
                  value:
                    data:
                      query: Social media scraping API
                      results:
                      - title: Social Fetch — Social Media Scraper API for TikTok, Instagram, YouTube & X
                        url: https://www.socialfetch.dev
                        content: Pull real-time data from any social platform. One API. Profiles, posts, comments, videos, transcripts, and metrics — from TikTok, Instagram, YouTube, and 20+ platforms.
                      - title: Social Media Data Scraper APIs
                        url: https://ensembledata.com
                        content: With our social media scraping APIs, you can fetch user profiles, posts, comments, replies, engagement metrics (likes, views, shares), hashtags, keywords, and brand mentions.
                      page:
                        page: 1
                        hasMore: true
                        nextPage: 2
                    meta:
                      requestId: req_01example
                      creditsCharged: 1
                      version: v1
                empty:
                  value:
                    data:
                      query: obscure query with no hits xyz123
                      results: []
                      page:
                        page: 1
                        hasMore: false
                        nextPage: null
                    meta:
                      requestId: req_01websearch_empty
                      creditsCharged: 1
                      version: v1
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - bad_request
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
