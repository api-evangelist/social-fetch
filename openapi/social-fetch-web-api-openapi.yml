  /v1/web/markdown:
    get:
      tags:
      - Web
      summary: Generate web page markdown
      description: Convert a web page URL into clean markdown.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      x-socialfetch-agent-hints:
        emptyResults: '`lookupStatus: restricted` means bot/access protection blocked the fetch; content fields are null.'
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 2083
          description: Web page URL to fetch.
        required: true
        description: Web page URL to fetch.
        name: url
        in: query
      - schema:
          type: string
          enum:
          - fit
          - raw
          - bm25
          default: fit
          description: 'Markdown extraction filter. `fit`: strip boilerplate and extract the main readable content. `raw`: full unfiltered page markdown, no content pruning. `bm25`: rank and return only the content most relevant to `query`, using the BM25 keyword-relevance algorithm — requires `query` to be set.'
        required: false
        description: 'Markdown extraction filter. `fit`: strip boilerplate and extract the main readable content. `raw`: full unfiltered page markdown, no content pruning. `bm25`: rank and return only the content most relevant to `query`, using the BM25 keyword-relevance algorithm — requires `query` to be set.'
        name: filter
        in: query
      - schema:
          type: string
          maxLength: 500
          description: Optional query string used by the bm25 filter to rank relevant content.
        required: false
        description: Optional query string used by the bm25 filter to rank relevant content.
        name: query
        in: query
      - schema:
          type: string
          enum:
          - enabled
          - bypass
          - write_only
          default: enabled
          description: 'Cache behavior. `enabled`: read from cache if present, else fetch and write to cache. `bypass`: always fetch fresh, ignoring and not updating the cache. `write_only`: always fetch fresh, but write the result to cache without reading from it first. Default: `enabled`.'
        required: false
        description: 'Cache behavior. `enabled`: read from cache if present, else fetch and write to cache. `bypass`: always fetch fresh, ignoring and not updating the cache. `write_only`: always fetch fresh, but write the result to cache without reading from it first. Default: `enabled`.'
        name: cacheMode
        in: query
      - schema:
          type: boolean
          description: When true, scroll the page to load dynamically appended content (infinite scroll). Default false.
        required: false
        description: When true, scroll the page to load dynamically appended content (infinite scroll). Default false.
        name: scanFullPage
        in: query
      - schema:
          type: string
          maxLength: 200
          description: Wait for a CSS selector before extraction. Must be prefixed with "css:" (e.g. css:main). JavaScript wait conditions are not supported.
        required: false
        description: Wait for a CSS selector before extraction. Must be prefixed with "css:" (e.g. css:main). JavaScript wait conditions are not supported.
        name: waitFor
        in: query
      responses:
        '200':
          description: Markdown extraction result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - restricted
                        description: Whether page content could be extracted. Restricted means bot protection or similar access controls blocked automated fetching.
                      url:
                        type: string
                        description: URL that was fetched.
                      status:
                        type:
                        - integer
                        - 'null'
                        description: HTTP status code reported for the page fetch when available; null when restricted.
                      markdown:
                        type:
                        - object
                        - 'null'
                        properties:
                          raw:
                            type: string
                            description: Primary markdown text extracted from the page.
                          fit:
                            type: string
                            description: Filtered markdown optimized for LLM consumption.
                          withCitations:
                            type: string
                            description: Markdown with numbered citations for outbound links.
                          references:
                            type: string
                            description: Reference list for cited links in the markdown output.
                        required:
                        - raw
                        description: Markdown content when lookupStatus is found; null when restricted.
                      metadata:
                        type: object
                        additionalProperties: {}
                        description: Page metadata such as title when available.
                      links:
                        type: object
                        properties:
                          internal:
                            type: array
                            items:
                              type: object
                              properties:
                                href:
                                  type: string
                                  description: Absolute or page-relative link href.
                                text:
                                  type: string
                                  description: Anchor text when available.
                                title:
                                  type: string
                                  description: Title attribute when available.
                              required:
                              - href
                              description: A hyperlink discovered on the page.
                            description: Same-host links discovered on the page.
                          external:
                            type: array
                            items:
                              type: object
                              properties:
                                href:
                                  type: string
                                  description: Absolute or page-relative link href.
                                text:
                                  type: string
                                  description: Anchor text when available.
                                title:
                                  type: string
                                  description: Title attribute when available.
                              required:
                              - href
                              description: A hyperlink discovered on the page.
                            description: Cross-host links discovered on the page.
                        required:
                        - internal
                        - external
                        description: Links discovered on the page when available.
                      media:
                        type: object
                        properties:
                          images:
                            type: array
                            items:
                              type: object
                              properties:
                                src:
                                  type: string
                                  description: Image source URL.
                                alt:
                                  type: string
                                  description: Alt text when available.
                                score:
                                  type: number
                                  description: Optional relevance score from the crawler.
                              required:
                              - src
                              description: An image discovered on the page.
                            description: Images on the page.
                          videos:
                            type: array
                            items:
                              type: object
                              properties:
                                src:
                                  type: string
                                alt:
                                  type: string
                                score:
                                  type: number
                              required:
                              - src
                            description: Videos on the page.
                          audios:
                            type: array
                            items:
                              type: object
                              properties:
                                src:
                                  type: string
                                alt:
                                  type: string
                                score:
                                  type: number
                              required:
                              - src
                            description: Audio elements on the page.
                        description: Media assets discovered on the page when available.
                    required:
                    - lookupStatus
                    - url
                    - status
                    - markdown
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
