                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
              example:
                data:
                  lookupStatus: found
                  url: https://www.socialfetch.dev/
                  status: 200
                  markdown:
                    raw: '# Social media scraper API for every major platform.

                      Scrape profiles, posts, comments, videos, transcripts, and metrics from TikTok, Instagram, YouTube, X, LinkedIn, and more.'
                    fit: Social media scraper API for every major platform. Scrape profiles, posts, comments, videos, transcripts, and metrics from TikTok, Instagram, YouTube, X, LinkedIn, and more.
                meta:
                  requestId: req_01example
                  creditsCharged: 1
                  version: v1
        '400':
          description: Invalid query parameters or disallowed URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
