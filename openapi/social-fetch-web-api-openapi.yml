  /v1/web/extract:
    post:
      tags:
      - Web
      summary: Extract structured data from a web page
      description: Extract structured fields from a web page using a CSS selector schema.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 2
        surcharges: []
        maxCredits: 2
        normalizationFailureCredits: 2
      x-socialfetch-credits-pricing: 2 credits per successful request.
      x-socialfetch-agent-hints:
        emptyResults: '`lookupStatus: restricted` means bot/access protection blocked the fetch; `extracted` is null.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  minLength: 1
                  maxLength: 2083
                  description: Web page URL to fetch.
                schema:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 200
                    baseSelector:
                      type: string
                      minLength: 1
                      maxLength: 500
                    fields:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 100
                          selector:
                            type: string
                            minLength: 1
                            maxLength: 500
                          type:
                            type: string
                            enum:
                            - text
                            - attribute
                            - html
                            - regex
                            default: text
                          attribute:
                            type: string
                            minLength: 1
                            maxLength: 100
                        required:
                        - name
                        - selector
                        description: One CSS extraction field.
                      minItems: 1
                      maxItems: 50
                  required:
                  - name
                  - baseSelector
                  - fields
                  description: 'Crawl4AI JsonCssExtractionStrategy schema: baseSelector plus fields.'
                scanFullPage:
                  type: boolean
                  description: When true, scroll the page to load dynamically appended content.
                waitFor:
                  type: string
                  maxLength: 200
                  description: Wait for a CSS selector before extraction. Must be prefixed with "css:" (e.g. css:main). JavaScript wait conditions are not supported.
              required:
              - url
              - schema
              description: JSON body for structured CSS extraction.
            example:
              url: https://example.com/products
              schema:
                name: products
                baseSelector: div.product
                fields:
                - name: name
                  selector: h2
                  type: text
                - name: price
                  selector: .price
                  type: text
      responses:
        '200':
          description: Structured CSS extraction result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - restricted
                        description: Whether page content could be extracted. Restricted means bot protection or similar access controls blocked automated fetching.
                      url:
                        type: string
                        description: URL that was fetched.
                      status:
                        type:
                        - integer
                        - 'null'
                        description: HTTP status code reported for the page fetch when available; null when restricted.
                      extracted:
                        type:
                        - array
                        - 'null'
                        items:
                          type: object
                          additionalProperties: {}
                        description: Structured rows extracted via CSS schema when lookupStatus is found; null when restricted.
