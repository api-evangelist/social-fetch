  /v1/apple-music/track:
    get:
      tags:
      - Apple Music
      summary: Get Apple Music track
      description: Get an Apple Music track by id or track URL.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-agent-hints:
        disambiguation: Album URLs must include i={songId} to identify the song. Use GET /v1/apple-music/album for album lookups.
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional Apple Music song id for the request.
        required: false
        description: Optional Apple Music song id for the request.
        name: trackId
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: Optional Apple Music song URL for the request.
        required: false
        description: Optional Apple Music song URL for the request.
        name: url
        in: query
      responses:
        '200':
          description: Track lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether the track was found.
                      track:
                        type:
                        - object
                        - 'null'
                        properties:
                          platform:
                            type: string
                            enum:
                            - apple_music
                            description: Platform for this track.
                          trackId:
                            type: string
                            minLength: 1
                            description: Stable Apple Music song identifier.
                          title:
                            type: string
                            minLength: 1
                            description: Track title.
                          durationMs:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Track duration in milliseconds when available.
                          trackNumber:
                            type:
                            - integer
                            - 'null'
                            description: Track number on the album when available.
                            exclusiveMinimum: 0
                          explicit:
                            type:
                            - boolean
                            - 'null'
                            description: Whether the track is marked explicit when available.
                          artistName:
                            type:
                            - string
                            - 'null'
                            description: Primary artist display name when available.
                          albumTitle:
                            type:
                            - string
                            - 'null'
                            description: Album title when available.
                          artworkUrl:
                            type:
                            - string
                            - 'null'
                            description: Best available square artwork image URL when available.
                          previewUrl:
                            type:
                            - string
                            - 'null'
                            description: Short audio preview URL when available.
                          trackUrl:
                            type:
                            - string
                            - 'null'
                            description: Canonical public Apple Music song URL when available.
                        required:
                        - platform
                        - trackId
                        - title
                        - durationMs
                        - trackNumber
                        - explicit
                        - artistName
                        - albumTitle
                        - artworkUrl
                        - previewUrl
                        - trackUrl
                        description: Track details when available.
                    required:
                    - lookupStatus
                    - track
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
