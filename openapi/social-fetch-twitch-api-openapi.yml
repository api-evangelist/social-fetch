                              - 'null'
                              description: Twitch login when available.
                            displayName:
                              type:
                              - string
                              - 'null'
                              description: Display name when available.
                            avatarUrl:
                              type:
                              - string
                              - 'null'
                              description: Profile image URL when available.
                          required:
