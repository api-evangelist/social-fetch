                          - handle
                          - displayName
                          - avatarUrl
                          description: A similar Twitch streamer suggested for the channel.
                        description: Similar streamers suggested for the channel when available.
                    required:
                    - lookupStatus
                    - profile
                    - metrics
                    - recentVideos
                    - similarStreamers
                    description: Endpoint-specific response payload.
