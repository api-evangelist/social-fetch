                        enum:
                        - found
                        - not_found
                        description: Whether the profile was found.
                      profile:
                        type:
                        - object
                        - 'null'
                        properties:
                          platform:
                            type: string
                            enum:
                            - twitch
                            description: Social platform for this profile.
                          handle:
                            type: string
                            description: Twitch login without a leading @.
                          displayName:
                            type:
                            - string
                            - 'null'
                            description: Public display name on the Twitch profile.
                          bio:
                            type:
                            - string
                            - 'null'
                            description: Profile description text.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Best available profile image URL.
                          bannerUrl:
                            type:
                            - string
                            - 'null'
                            description: Profile banner image URL when available.
                          profileUrl:
                            type: string
                            minLength: 1
                            description: Canonical public Twitch channel URL.
                          platformUserId:
                            type:
                            - string
                            - 'null'
                            description: Twitch user id as a string when available.
                          isPartner:
                            type:
                            - boolean
                            - 'null'
                            description: Whether the channel is a Twitch Partner when known.
                          isLive:
                            type:
                            - boolean
                            - 'null'
                            description: Whether the channel is currently live when known.
                          currentViewersCount:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Current live viewer count when the channel is live.
                          socialLinks:
                            type: object
                            properties:
                              x:
                                type:
                                - string
                                - 'null'
                                description: Linked X (Twitter) URL when available.
                              instagram:
                                type:
                                - string
                                - 'null'
                                description: Linked Instagram URL when available.
                              youtube:
                                type:
                                - string
                                - 'null'
                                description: Linked YouTube URL when available.
                              tiktok:
                                type:
                                - string
                                - 'null'
                                description: Linked TikTok URL when available.
                            required:
                            - x
                            - instagram
                            - youtube
                            - tiktok
                            description: Linked social accounts when available.
                        required:
                        - platform
                        - handle
                        - displayName
                        - bio
                        - avatarUrl
                        - bannerUrl
                        - profileUrl
                        - platformUserId
                        - isPartner
                        - isLive
                        - currentViewersCount
                        - socialLinks
                        description: Profile details when available.
                      metrics:
                        type:
                        - object
                        - 'null'
                        properties:
                          followers:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Follower count for the channel when available.
                        required:
                        - followers
                        description: Profile metrics when available.
                      recentVideos:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              minLength: 1
                              description: Twitch video id.
                            title:
                              type:
                              - string
                              - 'null'
                              description: Video title when available.
                            thumbnailUrl:
                              type:
                              - string
                              - 'null'
                              description: Preview thumbnail URL when available.
                            publishedAt:
                              type:
                              - string
                              - 'null'
                              description: ISO-8601 publish timestamp when available.
                            viewCount:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: View count when available.
                            durationSeconds:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Video duration in seconds when available.
                            game:
                              type:
                              - object
                              - 'null'
                              properties:
                                id:
                                  type:
                                  - string
                                  - 'null'
                                  description: Game or category id when available.
                                slug:
                                  type:
                                  - string
                                  - 'null'
                                  description: Game or category slug when available.
                                name:
                                  type:
                                  - string
                                  - 'null'
                                  description: Game or category display name when available.
                                boxArtUrl:
                                  type:
                                  - string
                                  - 'null'
                                  description: Box art image URL when available.
                              required:
                              - id
                              - slug
                              - name
                              - boxArtUrl
                              description: Game or category for the video when available.
                          required:
                          - id
                          - title
                          - thumbnailUrl
                          - publishedAt
                          - viewCount
                          - durationSeconds
                          - game
                          description: A recent video or broadcast from the channel.
                        description: Recent videos or broadcasts from the channel when available.
