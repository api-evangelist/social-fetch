  /v1/threads/profiles/{handle}/posts:
    get:
      tags:
      - Threads
      summary: List Threads profile posts
      description: List posts from a Threads profile by handle.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-agent-hints:
        emptyResults: '`lookupStatus: found` means the handle resolved; `data.posts` may still be empty.'
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Threads handle whose posts should be listed.
        required: true
        description: Threads handle whose posts should be listed.
        name: handle
        in: path
      - schema:
          type: boolean
          description: When true, returns a smaller response with fewer post fields when available.
        required: false
        description: When true, returns a smaller response with fewer post fields when available.
        name: trim
        in: query
      responses:
        '200':
          description: Posts for the requested profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether the handle resolved for this listing.
                      posts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              minLength: 1
                              description: Threads post identifier.
                            shortcode:
                              type: string
                              minLength: 1
                              description: Public short code used in the Threads post URL.
                            url:
                              type: string
                              minLength: 1
                              description: Canonical public URL for this Threads post.
                            caption:
                              type:
                              - string
                              - 'null'
                              description: Caption text when available.
                            createdAt:
                              type: string
                              format: date-time
                              description: When the post was published (ISO-8601).
                            author:
                              type: object
                              properties:
                                platform:
                                  type: string
                                  enum:
                                  - threads
                                  description: Social platform.
                                handle:
                                  type: string
                                  minLength: 1
                                  description: Threads username without a leading @.
                                platformUserId:
                                  type: string
                                  description: Numeric profile identifier when available.
                                avatarUrl:
                                  type:
                                  - string
                                  - 'null'
                                  description: Profile image URL when available.
                                verified:
                                  type: boolean
                                  description: Whether the profile is verified.
                                privateAccount:
                                  type: boolean
                                  description: Whether the account is private.
                              required:
                              - platform
                              - handle
                              - verified
                              description: Author snapshot when available.
                            metrics:
                              type: object
                              properties:
                                likes:
                                  type: integer
                                  minimum: 0
                                  description: Like count when exposed.
                                replies:
                                  type: integer
                                  minimum: 0
                                  description: Reply count when exposed.
                                reposts:
                                  type: integer
                                  minimum: 0
                                  description: Native repost count when exposed.
                                reshares:
                                  type: integer
                                  minimum: 0
                                  description: Share or reshare count when exposed.
                                quotes:
                                  type: integer
                                  minimum: 0
                                  description: Quote post count when exposed.
                              description: Engagement metrics when available.
                            media:
                              type: object
                              properties:
                                images:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      url:
                                        type: string
                                        minLength: 1
                                        description: Image URL.
                                      width:
                                        type: integer
                                        minimum: 0
                                        description: Width in pixels when available.
                                      height:
                                        type: integer
                                        minimum: 0
                                        description: Height in pixels when available.
                                    required:
                                    - url
                                    description: An image rendition for Threads media.
                                  description: Primary image variants when present.
                                videos:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      url:
                                        type: string
                                        minLength: 1
                                        description: Video URL.
                                      width:
                                        type: integer
                                        minimum: 0
                                        description: Width in pixels when available.
                                      height:
                                        type: integer
                                        minimum: 0
                                        description: Height in pixels when available.
                                      type:
                                        type: string
                                        minLength: 1
                                        description: Media type label when exposed.
                                    required:
                                    - url
                                    description: A video rendition for Threads media.
                                  description: Playable video variants when present.
                                carousel:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      images:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            url:
                                              type: string
                                              minLength: 1
                                              description: Image URL.
                                            width:
                                              type: integer
                                              minimum: 0
                                              description: Width in pixels when available.
                                            height:
                                              type: integer
                                              minimum: 0
                                              description: Height in pixels when available.
                                          required:
                                          - url
                                          description: An image rendition for Threads media.
                                        description: Images in this carousel cell when present.
                                      videos:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            url:
                                              type: string
                                              minLength: 1
                                              description: Video URL.
                                            width:
                                              type: integer
                                              minimum: 0
                                              description: Width in pixels when available.
                                            height:
                                              type: integer
                                              minimum: 0
                                              description: Height in pixels when available.
                                            type:
                                              type: string
                                              minLength: 1
                                              description: Media type label when exposed.
                                          required:
                                          - url
                                          description: A video rendition for Threads media.
                                        description: Videos in this carousel cell when present.
                                    description: One carousel item when a Threads post contains multiple media.
                                  description: Carousel media items when present.
                              description: Media payloads when resolved.
                            pinned:
                              type: boolean
                              description: Whether the post is pinned on the profile when known.
                            reply:
                              type: boolean
                              description: Whether this post is a reply when known.
                          required:
                          - id
                          - shortcode
                          - url
                          - caption
                          - createdAt
                          - metrics
                          description: A single Threads post in a profile listing.
                        description: Threads posts returned for this request.
                    required:
                    - lookupStatus
                    - posts
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
