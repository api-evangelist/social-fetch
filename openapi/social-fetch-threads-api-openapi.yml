openapi: 3.2.0
info:
  title: Social Fetch Public Threads API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Threads
paths:
  /v1/threads/profiles/{handle}:
    get:
      tags:
      - Threads
      summary: Get Threads profile
      description: Get a Threads profile for a creator or account.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Threads handle to look up, with or without a leading @.
        required: true
        description: Threads handle to look up, with or without a leading @.
        name: handle
        in: path
      responses:
        '200':
          description: Threads profile lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - private
                        - not_found
                        description: Whether the profile was resolved.
                      profile:
                        type:
                        - object
                        - 'null'
                        properties:
                          platform:
                            type: string
                            enum:
                            - threads
                            description: Social platform for this profile.
                          handle:
                            type: string
                            description: Threads username without the leading @.
                          displayName:
                            type:
                            - string
                            - 'null'
                            description: Public display name shown on the Threads profile.
                          bio:
                            type:
                            - string
                            - 'null'
                            description: Profile biography text.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Best available avatar image URL for the profile.
                          verified:
                            type: boolean
                            description: Whether the profile is marked as verified.
                          profileUrl:
                            type: string
                            minLength: 1
                            description: Canonical public Threads profile URL.
                          privateAccount:
                            type: boolean
                            description: Whether the Threads account is private.
                          platformUserId:
                            type: string
                            description: Threads profile id as a string when available.
                          threadsOnlyUser:
                            type: boolean
                            description: Whether the account is marked as a Threads-only profile.
                          bioLinks:
                            type: array
                            items:
                              type: object
                              properties:
                                url:
                                  type: string
                                  minLength: 1
                                  description: Destination URL for the profile link.
                                verified:
                                  type: boolean
                                  description: Whether the profile link is marked as verified.
                                id:
                                  type: string
                                  description: Stable link identifier when available.
                              required:
                              - url
                              description: A link from the Threads profile bio.
                            description: Structured bio links when available.
                          avatarVersions:
                            type: array
                            items:
                              type: object
                              properties:
                                url:
                                  type: string
                                  minLength: 1
                                  description: Avatar image URL.
                                width:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  description: Avatar image width in pixels when available.
                                height:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  description: Avatar image height in pixels when available.
                              required:
                              - url
                              description: An available avatar image version.
                            description: Avatar image versions when available.
                        required:
                        - platform
                        - handle
                        - displayName
                        - bio
                        - avatarUrl
                        - verified
                        - profileUrl
                        description: Profile details when available.
                      metrics:
                        type:
                        - object
                        - 'null'
                        properties:
                          followers:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Follower count for the profile when available.
                        required:
                        - followers
                        description: Profile metrics when available.
                    required:
                    - lookupStatus
                    - profile
                    - metrics
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
              examples:
                found:
                  value:
                    data:
                      lookupStatus: found
                      profile:
                        platform: threads
                        handle: trendspider
                        displayName: TrendSpider
                        bio: 'Award-Winning 🏆 All-in-One Trading Platform.

