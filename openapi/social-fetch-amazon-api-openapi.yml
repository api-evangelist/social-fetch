openapi: 3.2.0
info:
  title: Social Fetch Public Amazon API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Amazon
paths:
  /v1/amazon/shop:
    get:
      tags:
      - Amazon
      summary: Get Amazon Shop page
      description: Get a creator Amazon Shop storefront by URL.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      x-socialfetch-agent-hints:
        emptyResults: 'Empty `data.lists`, `data.trendingPicks`, or `data.curations` with `lookupStatus: found` means this storefront page has no collections (or this page of a paginated shop is empty). `data.lists` mixes idea lists (`kind: list`) and shoppable photos (`kind: photo`). The cursor pages `data.lists`; profile, trendingPicks, and curations are first-page fields. This is not a product PDP lookup.'
        disambiguation: Pass an amazon.com/shop/... creator storefront URL. Extra path segments such as `/list/...` are resolved to the storefront. Product pages (`/dp/`) and brand stores (`/stores/`) are rejected with HTTP 400.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: Public Amazon Shop storefront URL.
        required: true
        description: Public Amazon Shop storefront URL.
        name: url
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 8192
          description: Pagination cursor returned by a previous response.
        required: false
        description: Pagination cursor returned by a previous response.
        name: cursor
        in: query
      responses:
        '200':
          description: Amazon Shop storefront page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether the storefront resolved for this request.
                      profile:
                        type:
                        - object
                        - 'null'
                        properties:
                          handle:
                            type:
                            - string
                            - 'null'
                            description: Shop handle from the storefront URL, when available.
                          name:
                            type:
                            - string
                            - 'null'
                            description: Display name shown on the shop page.
                          description:
                            type:
                            - string
                            - 'null'
                            description: Shop bio or description text, when available.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Creator avatar image URL, when available.
                          profileUrl:
                            type:
                            - string
                            - 'null'
                            description: Canonical public Amazon Shop storefront URL, when available.
                          isTopCreator:
                            type:
                            - boolean
                            - 'null'
                            description: Whether Amazon marks this shop as a Top Creator. Null on continuation pages that omit profile details.
                          socials:
                            type: array
                            items:
                              type: object
                              properties:
                                platform:
                                  type: string
                                  minLength: 1
                                  description: Normalized social platform slug (e.g. tiktok, instagram).
                                url:
                                  type: string
                                  minLength: 1
                                  description: Public social profile or destination URL.
                              required:
                              - platform
                              - url
                              description: A social profile linked from the Amazon Shop page.
                            description: Social destinations linked from the shop page.
                        required:
                        - handle
                        - name
                        - description
                        - avatarUrl
                        - profileUrl
                        - isTopCreator
                        - socials
                        description: Shop profile when found; otherwise null.
                      lists:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type:
                              - string
                              - 'null'
                              enum:
                              - list
                              - photo
                              - null
                              description: Whether this row is an idea list or a shoppable photo. Null when the URL does not identify either.
                            id:
                              type:
                              - string
                              - 'null'
                              description: List or shoppable-photo identifier from the public URL, when available.
                            title:
                              type:
                              - string
                              - 'null'
                              description: List title. Shoppable photos usually have no title.
                            itemCount:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Number of items in the list, when available.
                            imageUrl:
                              type:
                              - string
                              - 'null'
                              description: List cover image URL, when available.
                            url:
                              type:
                              - string
                              - 'null'
                              description: Public URL for the list, when available.
                          required:
                          - kind
                          - id
                          - title
                          - itemCount
                          - imageUrl
                          - url
                          description: 'A row in the storefront lists feed: an idea list (`kind: list`) or a shoppable photo (`kind: photo`).'
                        description: Idea lists and shoppable photos on this page of the storefront feed. Filter by `kind` to separate them.
                      trendingPicks:
                        type: array
                        items:
                          type: object
                          properties:
                            asin:
                              type:
                              - string
                              - 'null'
                              description: Amazon ASIN for the product, when available.
                            url:
                              type:
                              - string
                              - 'null'
                              description: Canonical public product URL (`/dp/{ASIN}`), when available.
                            imageUrl:
                              type:
                              - string
                              - 'null'
                              description: Product image URL, when available.
                            price:
                              type:
                              - number
                              - 'null'
                              minimum: 0
                              description: Current price in USD as a number, when available.
                            discountPercent:
                              type:
                              - number
                              - 'null'
                              minimum: 0
                              description: Discount percent as a number, when available.
                          required:
                          - asin
                          - url
                          - imageUrl
                          - price
                          - discountPercent
                          description: A trending product pick on the Amazon Shop page.
                        description: Trending product picks on this page.
                      curations:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type:
                              - string
                              - 'null'
                              description: Curation identifier from the public URL, when available.
                            title:
                              type:
                              - string
                              - 'null'
                              description: Curation title.
                            postCount:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Number of posts in the curation, when available.
                            imageUrl:
                              type:
                              - string
                              - 'null'
                              description: Curation cover image URL, when available.
                            url:
                              type:
                              - string
                              - 'null'
                              description: Public URL for the curation, when available.
                          required:
                          - id
                          - title
                          - postCount
                          - imageUrl
                          - url
                          description: A shoppable curation on the Amazon Shop page.
                        description: Curations on this page.
                      page:
                        type: object
                        properties:
                          hasMore:
                            type: boolean
                            description: Whether another page is available.
                          nextCursor:
                            type:
                            - string
                            - 'null'
                            description: Cursor to pass in the next request when more pages exist; null on the last page.
                        required:
                        - hasMore
                        - nextCursor
                        description: Pagination state for the current response.
                    required:
                    - lookupStatus
                    - profile
                    - lists
                    - trendingPicks
                    - curations
                    - page
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
              examples:
                found:
                  value:
