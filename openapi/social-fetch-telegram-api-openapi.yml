openapi: 3.2.0
info:
  title: Social Fetch Public Telegram API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Telegram
paths:
  /v1/telegram/channels/{handle}:
    get:
      tags:
      - Telegram
      summary: Get Telegram public entity
      description: Get metadata for a public Telegram channel or group by username.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 200
          description: Telegram public username (channel or group), with or without leading @.
        required: true
        description: Telegram public username (channel or group), with or without leading @.
        name: handle
        in: path
      responses:
        '200':
          description: Channel or group lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        - restricted
                        description: Whether the channel or group was found, restricted, or not found.
                      entity:
                        type:
                        - object
                        - 'null'
                        properties:
                          entityType:
                            type: string
                            enum:
                            - channel
                            - group
                            - user_or_bot
                            - unknown
                            description: Resolved Telegram public entity type.
                          title:
                            type:
                            - string
                            - 'null'
                            description: Display name.
                          description:
                            type:
                            - string
                            - 'null'
                            description: Bio/description text. Line breaks are preserved when Telegram renders them on the public page.
                          subscriberCount:
                            type:
                            - integer
                            - 'null'
                            description: Subscriber count for broadcast channels from Telegram's public page at t.me/{handle}. Null for groups and other entity types.
                          memberCount:
                            type:
                            - integer
                            - 'null'
                            description: Member count for public groups/supergroups. Null for channels and other entity types.
                          onlineCount:
                            type:
                            - integer
                            - 'null'
                            description: Currently online member count when Telegram shows it on the public group page. Null for channels and other entity types.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: URL of the avatar image when Telegram serves a CDN photo.
                          isVerified:
                            type: boolean
                            description: Whether the entity has a Telegram verified badge.
                          handle:
                            type: string
                            description: The canonical username/handle that was looked up.
                        required:
                        - entityType
                        - title
                        - description
                        - subscriberCount
                        - memberCount
                        - onlineCount
                        - avatarUrl
                        - isVerified
                        - handle
                        description: Entity data when lookupStatus is `found`; null when `not_found` or `restricted`.
                    required:
                    - lookupStatus
                    - entity
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
              examples:
                found:
                  value:
                    data:
                      lookupStatus: found
                      entity:
                        entityType: channel
                        title: Test Channel
                        description: Channel description text.
                        subscriberCount: 12500
                        memberCount: null
                        onlineCount: null
                        avatarUrl: https://cdn4.telesco.pe/file/avatar.jpg
                        isVerified: false
                        handle: testchannel
                    meta:
                      requestId: req_01example
                      creditsCharged: 1
                      version: v1
                group:
                  value:
                    data:
                      lookupStatus: found
                      entity:
                        entityType: group
                        title: Futboltv ⚽️
                        description: 'Gol Videolari✅

                          Futbol Yangiliklari✅

                          Futbolga oid qiziqarli ma''lumotlar✅'
                        subscriberCount: null
                        memberCount: 1742860
                        onlineCount: 27088
                        avatarUrl: null
                        isVerified: false
                        handle: futbol_fudbol_sport_tv_gollar
                    meta:
                      requestId: req_01example_group
                      creditsCharged: 1
                      version: v1
                not_found:
                  value:
                    data:
                      lookupStatus: not_found
                      entity: null
                    meta:
                      requestId: req_01example_nf
                      creditsCharged: 1
                      version: v1
                restricted:
                  value:
                    data:
                      lookupStatus: restricted
                      entity: null
                    meta:
                      requestId: req_01example_restricted
                      creditsCharged: 1
                      version: v1
