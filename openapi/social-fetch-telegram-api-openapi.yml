  /v1/telegram/channels/{handle}/posts:
    get:
      tags:
      - Telegram
      summary: Get Telegram channel posts
      description: List recent posts from a public Telegram channel. Groups are not supported.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 200
          description: Telegram public username (channel or group), with or without leading @.
        required: true
        description: Telegram public username (channel or group), with or without leading @.
        name: handle
        in: path
      - schema:
          type: string
          description: Opaque pagination cursor from a previous response. Omit for the first page.
        required: false
        description: Opaque pagination cursor from a previous response. Omit for the first page.
        name: cursor
        in: query
      responses:
        '200':
          description: Channel posts listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        - restricted
                        description: Whether the channel was found, restricted, or not found.
                      posts:
                        type: array
                        items:
                          type: object
                          properties:
                            postId:
                              type: string
                              description: Unique post ID within the channel.
                            text:
                              type:
                              - string
                              - 'null'
                              description: Post text as simplified HTML (<br> line breaks, <a href> links, custom tg-emoji expanded to unicode, common HTML entities decoded so arrows and quotes read naturally in JSON). Null if the post contains only media.
                            date:
                              type:
                              - string
                              - 'null'
                              description: ISO 8601 publication timestamp.
                            views:
                              type:
                              - integer
                              - 'null'
                              description: View count from the public feed. Telegram may abbreviate large values (e.g. 1.13M → 1130000). Null for very recent posts.
                            forwardedFrom:
                              type:
                              - string
                              - 'null'
                              description: Original channel name if this post was forwarded.
                            replyTo:
                              type:
                              - object
                              - 'null'
                              properties:
                                postId:
                                  type: string
                                  description: Numeric post ID of the message being replied to, from the public t.me link in the reply preview.
                                authorName:
                                  type:
                                  - string
                                  - 'null'
                                  description: Channel or author name shown in the reply preview bar.
                                text:
                                  type:
                                  - string
                                  - 'null'
                                  description: Preview snippet of the replied-to message as shown in the embed (often truncated). May be a short media label such as Photo when Telegram does not show body text.
                              default: null
                              required:
                              - postId
                              - authorName
                              - text
                              description: Reply/quote preview when this post replies to another channel message; null otherwise.
                            photoUrls:
                              type: array
                              items:
                                type: string
                              description: Photo URLs from Telegram CDN. May expire over time; download promptly if needed.
                            videoUrl:
                              type:
                              - string
                              - 'null'
                              description: Video URL if the post contains a video. May expire over time; download promptly if needed.
                            reactions:
                              type: array
                              items:
                                type: object
                                properties:
                                  emoji:
                                    type:
                                    - string
                                    - 'null'
                                    description: Unicode reaction emoji when Telegram exposes it in the public HTML (including Stars as ⭐). Null for premium/custom animated reactions — use customEmojiId and emojiImageUrl.
                                  customEmojiId:
                                    type:
                                    - string
                                    - 'null'
                                    default: null
                                    description: Telegram custom emoji document id when the reaction uses a premium/custom emoji.
                                  emojiImageUrl:
                                    type:
                                    - string
                                    - 'null'
                                    default: null
                                    description: Preview image URL for custom emoji reactions (from Telegram's public emoji metadata). Null for standard unicode reactions.
                                  isPaid:
                                    type: boolean
                                    default: false
                                    description: True when the reaction is a Telegram Stars paid reaction.
                                  count:
                                    type: integer
                                    minimum: 0
                                    description: Number of users who added this reaction.
                                required:
                                - emoji
                                - count
                                description: A reaction emoji and count from the public channel feed.
                              default: []
                              description: Reaction counts shown on the public preview page. Empty when Telegram omits them for a post.
                          required:
                          - postId
                          - text
                          - date
                          - views
                          - forwardedFrom
                          - photoUrls
                          - videoUrl
                          description: A single Telegram channel post.
                        description: Posts in reverse chronological order (newest first) when lookupStatus is `found`. Empty when `not_found` or `restricted`.
                      page:
                        type: object
                        properties:
                          hasMore:
                            type: boolean
                            description: Whether another page is available.
                          nextCursor:
                            type:
                            - string
                            - 'null'
                            description: Cursor to pass in the next request when more pages exist; null on the last page.
                        required:
                        - hasMore
                        - nextCursor
                        description: Pagination state for the current page of posts.
                    required:
                    - lookupStatus
                    - posts
                    - page
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
              examples:
                found:
                  value:
                    data:
                      lookupStatus: found
                      posts:
                      - postId: '100'
                        text: Hello world
                        date: '2026-01-15T10:00:00+00:00'
                        views: 1200
                        forwardedFrom: null
                        replyTo: null
                        photoUrls: []
                        videoUrl: null
                        reactions: []
                      page:
                        hasMore: false
                        nextCursor: null
                    meta:
                      requestId: req_01example
                      creditsCharged: 1
                      version: v1
                not_found:
                  value:
                    data:
                      lookupStatus: not_found
                      posts: []
                      page:
                        hasMore: false
                        nextCursor: null
                    meta:
                      requestId: req_01example_posts_nf
                      creditsCharged: 1
                      version: v1
                restricted:
                  value:
                    data:
                      lookupStatus: restricted
                      posts: []
                      page:
                        hasMore: false
                        nextCursor: null
                    meta:
                      requestId: req_01example_posts_restricted
                      creditsCharged: 1
                      version: v1
        '400':
          description: Invalid handle or pagination cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
