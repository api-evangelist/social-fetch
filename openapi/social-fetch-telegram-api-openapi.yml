  /v1/telegram/channels/{handle}/posts/{postId}:
    get:
      tags:
      - Telegram
      summary: Get Telegram channel post
      description: Get a single public post from a Telegram channel by handle and post ID. Groups are not supported.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          description: Telegram public username (channel or group), with or without leading @.
        required: true
        description: Telegram public username (channel or group), with or without leading @.
        name: handle
        in: path
      - schema:
