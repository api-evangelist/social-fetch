                        title: 'Ask HN: How are credentials managed at your company?'
                        text: 'Access to servers, SaaS apps, crucial infrastructure software. There are tons of things that need to be accessed by people in the organisation. Although, in many cases, there is an option to create new users but sometimes it''s not and often, creating new users is more of a hassle every time someone needs access.

                          How does your company deal with giving and managing access?'
