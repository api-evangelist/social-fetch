  /v1/hackernews/feeds/{feed}:
    get:
      tags:
      - Hacker News
      summary: List a Hacker News feed
      description: List a Hacker News feed by type (top, new, best, ask, show, or jobs).
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          enum:
          - top
          - new
          - best
          - ask
          - show
          - jobs
          description: 'Hacker News feed: top, new, best, ask, show, or jobs.'
        required: true
        description: 'Hacker News feed: top, new, best, ask, show, or jobs.'
        name: feed
        in: path
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 49
          description: 'Zero-based page index (maximum 50 pages). Default: 0. Advance with `data.page.nextPage` when `hasMore` is true.'
        required: false
        description: 'Zero-based page index (maximum 50 pages). Default: 0. Advance with `data.page.nextPage` when `hasMore` is true.'
        name: page
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 50
          description: 'Items to hydrate per page (1–50). Default: 30. Prefer this over `pageSize`.'
        required: false
        description: 'Items to hydrate per page (1–50). Default: 30. Prefer this over `pageSize`.'
        name: limit
        in: query
      responses:
        '200':
          description: Hydrated feed page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      feed:
                        type: string
                        enum:
                        - top
                        - new
                        - best
                        - ask
                        - show
                        - jobs
                        description: Requested feed name.
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique Hacker News item id.
                              exclusiveMinimum: 0
                            type:
                              type: string
                              enum:
                              - story
                              - comment
                              - job
                              - poll
                              - pollopt
                              - unknown
                              description: Item type.
                            author:
                              type:
                              - string
                              - 'null'
                              description: Author username when present.
                            createdAt:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Creation time as an ISO-8601 timestamp.
                            title:
                              type:
                              - string
                              - 'null'
                              description: Plain-text title when present.
                            text:
                              type:
                              - string
                              - 'null'
                              description: Plain-text body when present (HTML stripped).
                            url:
                              type:
                              - string
                              - 'null'
                              format: uri
                              description: External URL when present and publicly safe.
                            score:
                              type:
                              - integer
                              - 'null'
                              description: Score / votes when present.
                            commentCount:
                              type:
                              - integer
                              - 'null'
                              description: Total comment count when present (stories/polls).
                            parentId:
                              type:
                              - integer
                              - 'null'
                              description: Parent item id for comments/pollopts.
                              exclusiveMinimum: 0
                            childIds:
                              type: array
                              items:
                                type: integer
                                exclusiveMinimum: 0
                              description: Child item ids in ranked display order when present. Some list endpoints omit children and return an empty array.
                            dead:
                              type: boolean
                              description: Whether the item is marked dead. Some list endpoints omit this signal and return false.
                            deleted:
                              type: boolean
                              description: Whether the item is marked deleted. Some list endpoints omit this signal and return false.
                            itemUrl:
                              type: string
                              format: uri
                              description: Canonical news.ycombinator.com item URL.
                          required:
                          - id
                          - type
                          - author
                          - createdAt
                          - title
                          - text
                          - url
                          - score
                          - commentCount
                          - parentId
                          - childIds
                          - dead
                          - deleted
                          - itemUrl
                          description: Compact Hacker News item (any type).
                        description: Hydrated feed items in official ranking order.
                      page:
                        type: object
                        properties:
                          page:
                            type: integer
                            minimum: 0
                            description: Zero-based page index for this response.
                          pageSize:
                            type: integer
                            description: Requested page size for this response.
                            exclusiveMinimum: 0
                          returned:
                            type: integer
                            minimum: 0
                            description: Number of hydrated items returned.
                          totalIds:
                            type: integer
