  /v1/hackernews/jobs/who-is-hiring:
    get:
      tags:
      - Hacker News
      summary: List structured Who is Hiring jobs
      description: List top-level jobs from the monthly Hacker News Who is Hiring thread (latest thread, or a YYYY-MM month).
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 'Calendar month (YYYY-MM) to pin a Who is Hiring thread. Default: latest thread.'
        required: false
        description: 'Calendar month (YYYY-MM) to pin a Who is Hiring thread. Default: latest thread.'
        name: month
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 49
          description: Zero-based page index of top-level hiring comments.
        required: false
        description: Zero-based page index of top-level hiring comments.
        name: page
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 50
          description: 'Job rows per page (1–50). Default: 20. Prefer this over `pageSize`.'
        required: false
        description: 'Job rows per page (1–50). Default: 20. Prefer this over `pageSize`.'
        name: limit
        in: query
      responses:
        '200':
          description: Structured Who is Hiring page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether a matching Who is Hiring thread was found.
                      thread:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: integer
                            description: Story id of the hiring thread.
                            exclusiveMinimum: 0
                          title:
                            type:
                            - string
                            - 'null'
                            description: Thread title.
                          createdAt:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: Thread creation time.
                          itemUrl:
                            type: string
                            format: uri
                            description: Canonical news.ycombinator.com item URL.
                        required:
                        - id
                        - title
                        - createdAt
                        - itemUrl
                        description: Thread summary when found.
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            commentId:
                              type: integer
                              description: Hiring comment id.
                              exclusiveMinimum: 0
                            author:
                              type:
                              - string
                              - 'null'
                              description: Comment author username.
                            createdAt:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Comment creation time.
                            text:
                              type:
                              - string
                              - 'null'
                              description: Full plain-text hiring comment (HTML stripped).
                            company:
                              type:
                              - string
                              - 'null'
                              description: Best-effort company name parse; null when unknown.
                            role:
                              type:
                              - string
                              - 'null'
                              description: Best-effort role/title parse; null when unknown.
                            location:
                              type:
                              - string
                              - 'null'
                              description: Best-effort location parse; null when unknown.
                            remote:
                              type:
                              - boolean
                              - 'null'
                              description: Best-effort remote signal; null when unknown.
                            salary:
