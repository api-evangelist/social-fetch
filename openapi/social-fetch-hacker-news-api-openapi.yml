openapi: 3.2.0
info:
  title: Social Fetch Public Hacker News API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Hacker News
paths:
  /v1/hackernews/search:
    get:
      tags:
      - Hacker News
      summary: Search Hacker News
      description: Search Hacker News by keyword.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          maxLength: 512
          description: Full-text search query. Required unless `frontPageOnly`, `author`, `domain`, or `url` is set.
        required: false
        description: Full-text search query. Required unless `frontPageOnly`, `author`, `domain`, or `url` is set.
        name: query
        in: query
      - schema:
          type: string
          enum:
          - all
          - story
          - comment
          - ask_hn
          - show_hn
          - launch_hn
          - job
          - poll
          description: 'Restrict search results to a Hacker News content type. `ask_hn`: Ask HN posts (questions to the community). `show_hn`: Show HN posts (projects/work being shared). `launch_hn`: Launch HN posts (YC-affiliated company launches). Default: `all`.'
        required: false
        description: 'Restrict search results to a Hacker News content type. `ask_hn`: Ask HN posts (questions to the community). `show_hn`: Show HN posts (projects/work being shared). `launch_hn`: Launch HN posts (YC-affiliated company launches). Default: `all`.'
        name: type
        in: query
      - schema:
          type: string
          enum:
          - popularity
          - date
          description: 'Ranking mode. Default: `popularity`.'
        required: false
        description: 'Ranking mode. Default: `popularity`.'
        name: sort
        in: query
      - schema:
          type: string
          enum:
          - 24h
          - week
          - month
          - year
          - all
          description: 'Creation-time window. Default: `all`.'
        required: false
        description: 'Creation-time window. Default: `all`.'
        name: dateRange
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 49
          description: Zero-based page index (maximum 50 pages, up to 1,000 hits).
        required: false
        description: Zero-based page index (maximum 50 pages, up to 1,000 hits).
        name: page
        in: query
      - schema:
          anyOf:
          - type: number
            enum:
            - 10
          - type: number
            enum:
            - 20
          - type: number
            enum:
            - 30
          - type: number
            enum:
            - 50
          description: 'Hits per page. Must be one of 10, 20, 30, 50. Default: 20. Prefer this over `pageSize`.'
        required: false
        description: 'Hits per page. Must be one of 10, 20, 30, 50. Default: 20. Prefer this over `pageSize`.'
        name: limit
        in: query
      - schema:
          type: boolean
          description: When true, restrict results to current front-page items. Allows omitting `query`.
        required: false
        description: When true, restrict results to current front-page items. Allows omitting `query`.
        name: frontPageOnly
        in: query
      - schema:
          type: boolean
          description: 'Include story/comment text in searchable fields. Default: true. Set false to search title/URL only.'
        required: false
        description: 'Include story/comment text in searchable fields. Default: true. Set false to search title/URL only.'
        name: searchStoryText
        in: query
      - schema:
          type: boolean
          description: When true, include author username in the searchable fields.
        required: false
        description: When true, include author username in the searchable fields.
        name: searchAuthor
        in: query
      - schema:
          type: boolean
          description: When true, enable prefix matching for query tokens.
        required: false
        description: When true, enable prefix matching for query tokens.
        name: prefix
        in: query
      - schema:
          type: boolean
          description: 'Enable typo tolerance. Default: true.'
        required: false
        description: 'Enable typo tolerance. Default: true.'
        name: typoTolerance
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9_-]+$
          description: Restrict results to items by this Hacker News username.
        required: false
        description: Restrict results to items by this Hacker News username.
        name: author
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 255
          description: Restrict search to story URLs matching this domain (e.g. example.com). Can omit `query`.
        required: false
        description: Restrict search to story URLs matching this domain (e.g. example.com). Can omit `query`.
        name: domain
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 2048
          description: Restrict search to story URLs matching this URL substring. Can omit `query`.
        required: false
        description: Restrict search to story URLs matching this URL substring. Can omit `query`.
        name: url
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 1000000
          description: Minimum points/score filter.
        required: false
        description: Minimum points/score filter.
        name: minPoints
        in: query
      responses:
        '200':
          description: Hacker News search results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      query:
                        type:
                        - string
                        - 'null'
                        description: Search query evaluated for this response, or null for front-page-only.
                      hits:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Hacker News item id.
                              exclusiveMinimum: 0
                            type:
                              type: string
                              enum:
                              - story
                              - comment
                              - poll
                              - job
                              - pollopt
                              - unknown
                              description: Normalized content type.
                            author:
                              type:
                              - string
                              - 'null'
                              description: Author username when present.
                            createdAt:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Creation time as an ISO-8601 timestamp.
                            title:
                              type:
                              - string
                              - 'null'
                              description: Plain-text title when present.
                            text:
                              type:
                              - string
                              - 'null'
                              description: Plain-text body when present (HTML stripped).
                            url:
                              type:
                              - string
                              - 'null'
                              format: uri
                              description: External story URL when present and publicly safe.
                            score:
                              type:
                              - integer
                              - 'null'
                              description: Points / score when present.
                            commentCount:
                              type:
                              - integer
                              - 'null'
                              description: Comment count for stories when present.
                            storyId:
                              type:
                              - integer
                              - 'null'
                              description: Parent story id for comment hits when present.
                              exclusiveMinimum: 0
                            parentId:
                              type:
                              - integer
                              - 'null'
                              description: Immediate parent item id when present.
                              exclusiveMinimum: 0
                            tags:
                              type: array
                              items:
                                type: string
                                minLength: 1
                              description: Normalized content tags for this hit (e.g. story, ask_hn).
                            itemUrl:
                              type: string
                              format: uri
                              description: Canonical news.ycombinator.com item URL.
                          required:
                          - id
                          - type
                          - author
                          - createdAt
                          - title
                          - text
                          - url
                          - score
                          - commentCount
                          - storyId
                          - parentId
                          - tags
                          - itemUrl
                          description: A single Hacker News search hit.
                        description: Search hits for this page.
                      page:
                        type: object
                        properties:
                          page:
                            type: integer
                            minimum: 0
                            description: Zero-based page index for this response.
                          pageSize:
                            type: integer
                            description: Requested page size for this response.
                            exclusiveMinimum: 0
                          returned:
                            type: integer
                            minimum: 0
                            description: Number of hits returned in this response.
                          hasMore:
                            type: boolean
                            description: Whether another page of results is available.
                          nextPage:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Next page index when hasMore is true; otherwise null.
                          totalHits:
                            type: integer
                            minimum: 0
                            description: Reported total hit count from the search index.
                          totalHitsExact:
                            type: boolean
                            description: Whether totalHits is exhaustive. When false, treat totalHits as an estimate.
                          maxAccessibleHits:
                            type: integer
                            description: Hard upper bound on pageable hits from the search index (typically 1000).
                            exclusiveMinimum: 0
                        required:
                        - page
                        - pageSize
                        - returned
                        - hasMore
                        - nextPage
                        - totalHits
                        - totalHitsExact
                        - maxAccessibleHits
                        description: Pagination information for the current response.
                    required:
                    - query
                    - hits
                    - page
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
              examples:
                found:
                  value:
                    data:
                      query: Dropbox
                      hits:
                      - id: 8863
                        type: story
                        author: dhouston
                        createdAt: '2007-04-04T19:16:40.000Z'
                        title: 'My YC app: Dropbox - Throw away your USB drive'
                        text: null
                        url: http://www.getdropbox.com/u/2/screencast.html
                        score: 104
                        commentCount: 71
                        storyId: 8863
                        parentId: null
                        tags:
                        - story
                        - author_dhouston
                        itemUrl: https://news.ycombinator.com/item?id=8863
                      page:
                        page: 0
                        pageSize: 20
                        returned: 1
                        hasMore: false
                        nextPage: null
                        totalHits: 1
                        totalHitsExact: true
                        maxAccessibleHits: 1000
                    meta:
                      requestId: req_01example_hackernews_search
                      creditsCharged: 1
                      version: v1
                empty:
                  value:
                    data:
                      query: zzzznonexistentqueryzzzz
                      hits: []
                      page:
                        page: 0
                        pageSize: 20
                        returned: 0
                        hasMore: false
                        nextPage: null
                        totalHits: 0
                        totalHitsExact: true
                        maxAccessibleHits: 1000
                    meta:
                      requestId: req_01example_hackernews_search_empty
                      creditsCharged: 1
                      version: v1
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - bad_request
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
