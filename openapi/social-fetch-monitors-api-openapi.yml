openapi: 3.2.0
info:
  title: Social Fetch Public Monitors API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Monitors
paths:
  /v1/monitors/sources:
    get:
      tags:
      - Monitors
      summary: List watchable sources
      description: List Social Fetch operations that can be watched by a monitor.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 0
        surcharges: []
        maxCredits: 0
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 0 credits per successful request.
      responses:
        '200':
          description: Every public API operation Monitors can watch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sources:
                        type: array
                        items:
                          type: object
                          properties:
                            operationId:
                              type: string
                              description: Public API operation id this source watches.
                            displayName:
                              type: string
                              description: Human name shown in the monitor-creation wizard.
                            mode:
                              type: string
                              enum:
                              - feed
                              - search
                              description: 'How new items are detected for this source: `feed` diffs by id-set plus a timestamp watermark; `search` diffs by id-set only.'
                            defaultIntervalMinutes:
                              type: integer
                              description: Suggested default polling interval in minutes.
                              exclusiveMinimum: 0
                            minIntervalMinutes:
                              type: integer
                              description: Minimum polling interval allowed for this source.
                              exclusiveMinimum: 0
                            docsTitle:
                              type: string
                              description: Full sentence title for this operation.
                            inputHint:
                              type: string
                              description: Optional qualifier shown next to the display name.
                            sampleEvent:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Identifier for the sample event.
                                apiVersion:
                                  type: string
                                  description: Monitor event envelope schema version.
                                type:
                                  type: string
                                  description: Event type, e.g. `webhook_endpoint.test`.
                                createdAt:
                                  type: string
                                  description: ISO-8601 timestamp for when the sample event was built.
                                monitor:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: Monitor id (`sample` for illustrative events).
                                    name:
                                      type: string
                                      description: Monitor display name.
                                  required:
                                  - id
                                  - name
                                  description: Monitor identity the event is attributed to.
                                source:
                                  type: object
                                  properties:
                                    operationId:
                                      type: string
                                      description: Watchable public API operation for this source.
                                    params:
                                      type: object
                                      additionalProperties: {}
                                      description: Parameters used for the poll that produced this event.
                                  required:
                                  - operationId
                                  - params
                                  description: Source operation and params for this event.
                                data:
                                  type: object
                                  additionalProperties: {}
                                  description: Event payload. Shape depends on the source.
                                billing:
                                  type: object
                                  properties:
                                    creditsCharged:
                                      type: integer
                                      minimum: 0
                                      description: Credits charged for the poll that produced this event.
                                  required:
                                  - creditsCharged
                                  description: Billing details for this event.
                              required:
                              - id
                              - apiVersion
                              - type
                              - createdAt
                              - monitor
                              - source
                              - data
                              - billing
                              description: Illustrative sample event envelope showing the shape a real webhook delivery for this source would have.
                          required:
                          - operationId
                          - displayName
                          - mode
                          - defaultIntervalMinutes
                          - minIntervalMinutes
                          - docsTitle
                          - sampleEvent
                          description: A watchable public API source Monitors can poll.
                        description: Every watchable public API source, in display order.
                    required:
                    - sources
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - bad_request
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: bad_request
                  message: Example message.
                  requestId: req_01example
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - unauthorized
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: unauthorized
                  message: Example message.
                  requestId: req_01example
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - internal_error
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: internal_error
                  message: Example message.
                  requestId: req_01example
      operationId: getV1MonitorsSources
      x-operation-id-source: derived
  /v1/monitors:
    post:
      tags:
      - Monitors
      summary: Create a monitor
      description: Create a monitor that polls a watchable source on a schedule.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 0
        surcharges: []
        maxCredits: 0
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 0 credits per successful request.
      parameters:
      - schema:
          type: boolean
          description: When true, validates the monitor and returns a cost preview without creating anything or running the baseline check.
        required: false
        description: When true, validates the monitor and returns a cost preview without creating anything or running the baseline check.
        name: dryRun
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Optional display name for the monitor. A default is generated from the source and params when omitted.
                operationId:
                  type: string
                  minLength: 1
                  description: Watchable public API operation id to poll. See GET /v1/monitors/sources.
                params:
                  type: object
                  additionalProperties: {}
                  description: Parameters for the watched operation.
                schedule:
                  oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - interval
                      minutes:
                        type: integer
                        description: Polling interval in minutes.
                        exclusiveMinimum: 0
                    required:
                    - type
                    - minutes
                    description: Fixed-interval polling schedule.
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - cron
                      expression:
                        type: string
                        minLength: 1
                        description: Cron expression for polling.
                      timezone:
                        type: string
                        minLength: 1
                        description: IANA timezone the cron expression is evaluated in.
                    required:
                    - type
                    - expression
                    - timezone
                    description: Cron-based polling schedule.
                  description: 'Polling schedule for a monitor: a fixed interval or a cron expression.'
                webhookEndpointId:
                  type: string
                  minLength: 1
                  description: Existing webhook endpoint id (owned by this account) to deliver events to. Mutually exclusive with `webhook`.
                webhook:
                  type: object
                  properties:
                    url:
                      type: string
                      format: uri
                      description: HTTPS URL to deliver events to.
                  required:
                  - url
                  description: Create a new webhook endpoint inline for this monitor. Mutually exclusive with `webhookEndpointId`.
                spendCapCredits:
                  type: integer
                  minimum: 0
                  description: Optional monthly credit spend cap for this monitor.
              required:
              - operationId
              - params
              - schedule
              description: Request body for creating a monitor.
      responses:
        '201':
          description: The newly created monitor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        description: Stable identifier for the monitor.
                      name:
                        type: string
                        description: Display name for the monitor.
                      operationId:
                        type: string
                        description: Watchable public API operation this monitor polls.
                      params:
                        type: object
                        additionalProperties: {}
                        description: Canonicalized parameters used for each poll.
                      schedule:
                        oneOf:
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - interval
                            minutes:
                              type: integer
                              description: Polling interval in minutes.
                              exclusiveMinimum: 0
                          required:
                          - type
                          - minutes
                          description: Fixed-interval polling schedule.
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - cron
                            expression:
                              type: string
                              minLength: 1
                              description: Cron expression for polling.
                            timezone:
                              type: string
                              minLength: 1
                              description: IANA timezone the cron expression is evaluated in.
                          required:
                          - type
                          - expression
                          - timezone
                          description: Cron-based polling schedule.
                        description: 'Polling schedule for a monitor: a fixed interval or a cron expression.'
                      nextRunAt:
                        type: string
                        description: ISO-8601 timestamp for the monitor's next scheduled poll.
                      costPreview:
                        type: object
                        properties:
                          perCheckCredits:
                            type: integer
                            minimum: 0
                            description: Credits charged per poll.
                          perDayCredits:
                            type: integer
                            minimum: 0
                            description: Estimated credits charged per day at this schedule.
                          perMonthCredits:
                            type: integer
                            minimum: 0
                            description: Estimated credits charged per 30-day month at this schedule.
                        required:
                        - perCheckCredits
                        - perDayCredits
                        - perMonthCredits
                        description: Estimated credit cost preview for this monitor's schedule.
                      baseline:
                        type: object
                        properties:
                          outcome:
                            type: string
                            description: Outcome of the synchronous baseline check.
                          previewItems:
                            type: array
                            items: {}
                            description: Preview of items observed by the baseline check.
                        required:
                        - outcome
                        - previewItems
                        description: Result of the synchronous baseline check run at creation time. Omitted for dry runs.
                      webhookEndpoint:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Newly created webhook endpoint id.
                          secret:
                            type: string
                            description: One-time signing secret for the new webhook endpoint. Shown only in this response — store it now.
                        required:
                        - id
                        - secret
                        description: Webhook endpoint created inline for this monitor, when `webhook.url` was given.
                    required:
                    - id
                    - name
                    - operationId
                    - params
                    - schedule
                    - nextRunAt
                    - costPreview
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
        '400':
          description: Invalid schedule, unknown source, invalid params, plan limit exceeded, or invalid webhook URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - bad_request
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: bad_request
                  message: Example message.
                  requestId: req_01example
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - unauthorized
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: unauthorized
                  message: Example message.
                  requestId: req_01example
        '403':
          description: The given webhook endpoint is not owned by this account, or the account has never purchased a credit pack or held a subscription (Monitors isn't available on free trial credits alone).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        anyOf:
                        - type: string
                          enum:
                          - forbidden
                        - type: string
                          enum:
                          - payment_history_required
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: forbidden
                  message: Example message.
                  requestId: req_01example
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - internal_error
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: internal_error
                  message: Example message.
                  requestId: req_01example
      operationId: postV1Monitors
      x-operation-id-source: derived
    get:
      tags:
      - Monitors
      summary: List monitors
      description: List monitors for the authenticated account.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 0
        surcharges: []
        maxCredits: 0
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 0 credits per successful request.
      parameters:
      - schema:
          type: string
          enum:
          - active
          - paused
          - exhausted
          - broken
          description: Optional filter to only return monitors in this status.
        required: false
        description: Optional filter to only return monitors in this status.
        name: status
        in: query
      responses:
        '200':
          description: Monitors owned by this account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      monitors:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
