                              - active
                              - paused
                              - exhausted
                              - broken
                              description: Current lifecycle status of the monitor.
                            statusReason:
                              type:
                              - string
                              - 'null'
                              description: Human-readable reason for the current status when set.
                            schedule:
                              oneOf:
                              - type: object
                                properties:
                                  type:
                                    type: string
