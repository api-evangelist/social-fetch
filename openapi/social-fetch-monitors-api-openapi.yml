                          - status
                          - statusReason
                          - schedule
                          - nextRunAt
                          - webhookEndpointId
                          - spendCapCredits
                          - spendThisMonth
                          - createdAt
                          - updatedAt
                          description: A monitor and its current configuration/state.
                        description: Monitors owned by this account, newest first.
