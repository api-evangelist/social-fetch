                found:
                  value:
                    data:
                      lookupStatus: found
                      profile:
                        platform: bluesky
                        handle: espn.com
                        displayName: ESPN
                        bio: Serving sports fans. Anytime. Anywhere.
                        avatarUrl: https://cdn.bsky.app/img/avatar/plain/did:plc:x7d6j54pm22ufehkes6jo4jf/bafkreie4oxawqqsfzvk47ysr3unsnmviedzpylxmwxnpa534to2bzas4ie@jpeg
