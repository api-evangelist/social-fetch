                              - platform
                              - platformUserId
                              - handle
                              - displayName
                              - avatarUrl
                              - verified
                              description: Author snapshot when available.
                            metrics:
                              type: object
                              properties:
                                likes:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  description: Like count when available.
                                reposts:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  description: Repost count when available.
                                replies:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  description: Reply count when available.
                                quotes:
