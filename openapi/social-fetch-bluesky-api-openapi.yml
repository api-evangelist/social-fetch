                        profileUrl: https://bsky.app/profile/espn.com
                        platformUserId: did:plc:x7d6j54pm22ufehkes6jo4jf
                        createdAt: '2024-11-25T21:49:49.345Z'
                      metrics:
                        followers: 198477
                        following: 32
                        posts: 659
                    meta:
                      requestId: req_01example
                      creditsCharged: 1
                      version: v1
