  /v1/github/profiles/{handle}/pull-requests:
    get:
      tags:
      - Github
      summary: List GitHub profile pull requests
      description: List pull requests authored by a GitHub user.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 39
          description: GitHub username whose public pull requests should be listed.
        required: true
        description: GitHub username whose public pull requests should be listed.
        name: handle
        in: path
      - schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Only return pull requests created on or after this date (YYYY-MM-DD).
        required: false
        description: Only return pull requests created on or after this date (YYYY-MM-DD).
        name: since
        in: query
      - schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Only return pull requests created on or before this date (YYYY-MM-DD).
        required: false
        description: Only return pull requests created on or before this date (YYYY-MM-DD).
        name: until
        in: query
      - schema:
          type: string
          minLength: 1
          description: Pagination cursor from a previous response (`data.page.nextCursor`).
        required: false
        description: Pagination cursor from a previous response (`data.page.nextCursor`).
        name: cursor
        in: query
      responses:
