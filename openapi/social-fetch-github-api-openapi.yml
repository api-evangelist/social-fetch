              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether pull requests could be listed for this handle.
                      pullRequests:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                              minLength: 1
                              description: Pull request title.
                            repo:
                              type: string
                              minLength: 1
                              description: Repository full name in `owner/repo` form.
                            number:
                              type:
                              - integer
                              - 'null'
                              description: GitHub pull request number when it can be read from `url`.
                              exclusiveMinimum: 0
                            state:
                              type:
                              - string
                              - 'null'
                              description: Pull request state when reported, typically `open` or `closed`. Merged pull requests are usually `closed`.
                            createdAt:
                              type:
                              - string
                              - 'null'
                              description: When the pull request was created (ISO 8601) when available.
                            url:
                              type: string
                              minLength: 1
                              description: Canonical public URL for the pull request.
                          required:
                          - title
                          - repo
                          - number
                          - state
                          - createdAt
                          - url
                          description: Public pull request authored by the requested GitHub user.
                        description: Public pull requests authored by this user.
                      page:
                        type: object
                        properties:
                          nextCursor:
                            type:
                            - string
