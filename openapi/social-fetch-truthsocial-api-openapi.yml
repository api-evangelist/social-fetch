openapi: 3.2.0
info:
  title: Social Fetch Public Truth Social API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: truthsocial
paths:
  /v1/truthsocial/profiles/{handle}:
    get:
      tags:
      - truthsocial
      summary: Get Truth Social profile
      description: Get a Truth Social profile by handle or account id.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 2
        surcharges: []
        maxCredits: 2
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 2 credits per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Truth Social handle or account id.
        required: true
        description: Truth Social handle or account id.
        name: handle
        in: path
      responses:
        '200':
          description: Truth Social profile lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether the profile was found.
                      profile:
                        type:
                        - object
                        - 'null'
                        properties:
                          platform:
                            type: string
                            enum:
                            - truthsocial
                            description: Social platform for this profile.
                          id:
                            type: string
                            pattern: ^\d{1,30}$
                            description: Stable Truth Social account id as a string.
                          handle:
                            type: string
                            minLength: 1
                            description: Truth Social handle without a leading @.
                          displayName:
                            type:
                            - string
                            - 'null'
                            description: Public display name when available.
                          bio:
                            type:
                            - string
                            - 'null'
                            description: Plain-text profile biography.
                          profileUrl:
                            type: string
                            minLength: 1
                            description: Canonical public Truth Social profile URL.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Avatar image URL when publicly available.
                          headerUrl:
                            type:
                            - string
                            - 'null'
                            description: Header/banner image URL when publicly available.
                          websiteUrl:
                            type:
                            - string
                            - 'null'
                            description: Website URL from the profile when publicly safe.
                          location:
                            type:
                            - string
                            - 'null'
                            description: Free-text location when present.
                          createdAt:
                            type:
                            - string
                            - 'null'
                            description: ISO-8601 timestamp when the account was created.
                          lastStatusAt:
                            type:
                            - string
                            - 'null'
                            description: ISO-8601 date of the latest public post when available.
                          isVerified:
                            type: boolean
                            description: Whether the account is marked verified.
                          isLocked:
                            type: boolean
                            description: Whether the account requires follow approval.
                          isBot:
                            type: boolean
                            description: Whether the account is marked as a bot.
                          metrics:
                            type: object
                            properties:
                              followers:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                description: Follower count when available.
                              following:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                description: Following count when available.
                              posts:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                description: Public post count when available.
                            required:
                            - followers
                            - following
                            - posts
                            description: Follower, following, and post counts.
                        required:
                        - platform
                        - id
                        - handle
                        - displayName
                        - bio
                        - profileUrl
                        - avatarUrl
                        - headerUrl
                        - websiteUrl
                        - location
                        - createdAt
                        - lastStatusAt
                        - isVerified
                        - isLocked
                        - isBot
                        - metrics
                        description: Profile when lookupStatus is `found`; null when `not_found`.
                    required:
                    - lookupStatus
                    - profile
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
              examples:
                found:
                  value:
                    data:
                      lookupStatus: found
                      profile:
                        platform: truthsocial
                        id: '107780257626128497'
                        handle: realDonaldTrump
                        displayName: Donald J. Trump
                        bio: null
                        profileUrl: https://truthsocial.com/@realDonaldTrump
                        avatarUrl: https://static-assets-1.truthsocial.com/tmtg:prime-ts-assets/accounts/avatars/107/780/257/626/128/497/original/454286ac07a6f6e6.jpeg
                        headerUrl: https://static-assets-1.truthsocial.com/tmtg:prime-ts-assets/accounts/headers/107/780/257/626/128/497/original/ba3b910ba387bf4e.jpeg
                        websiteUrl: https://www.donaldjtrump.com/
                        location: null
                        createdAt: '2022-02-11T16:16:57.705Z'
                        lastStatusAt: '2026-07-24'
                        isVerified: true
                        isLocked: false
                        isBot: false
                        metrics:
                          followers: 12928913
                          following: 69
                          posts: 35171
                    meta:
                      requestId: req_truthsocial_profile_example
                      creditsCharged: 2
                      version: v1
                not_found:
                  value:
                    data:
                      lookupStatus: not_found
                      profile: null
                    meta:
                      requestId: req_truthsocial_profile_not_found
                      creditsCharged: 2
                      version: v1
        '400':
          description: Invalid handle
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - bad_request
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: bad_request
                  message: Example message.
                  requestId: req_01example
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - unauthorized
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: unauthorized
                  message: Example message.
                  requestId: req_01example
        '402':
          description: Insufficient credits
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - insufficient_credits
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: insufficient_credits
                  message: Example message.
                  requestId: req_01example
        '500':
          description: Unexpected or billing error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - internal_error
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: internal_error
                  message: Example message.
                  requestId: req_01example
        '502':
          description: Lookup could not be completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - lookup_failed
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: lookup_failed
                  message: Example message.
                  requestId: req_01example
        '503':
          description: Service temporarily unavailable; safe to retry with backoff.
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Present on capacity, deadline, circuit-open, and safe transport outages (bounded 1–120).
              schema:
                type: integer
                minimum: 1
                maximum: 120
                example: 1
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - temporarily_unavailable
                        description: Machine-readable error code for the failed request.
                      message:
                        type: string
                        description: Human-readable error message. May change over time; do not parse it. Use `error.code` and the HTTP status for programmatic handling.
                      requestId:
                        type: string
                        description: Unique request identifier for tracing the failed API call.
                      checkoutUrl:
                        type: string
                        format: uri
                        description: Optional one-click checkout URL when credits are exhausted and a conversion offer is available.
                    required:
                    - code
                    - message
                    - requestId
                    description: Error details for the failed request.
                required:
                - error
                description: Standard error response envelope.
              example:
                error:
                  code: temporarily_unavailable
                  message: Example message.
                  requestId: req_01example
      operationId: getV1TruthsocialProfilesByHandle
      x-operation-id-source: derived
  /v1/truthsocial/profiles/{handle}/posts:
    get:
      tags:
      - truthsocial
      summary: List Truth Social profile posts
      description: List posts from a Truth Social profile by handle or account id.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 2
        surcharges:
        - queryParam: includeReplies
          credits: 2
          when: boolean_true
          label: Include replies
        maxCredits: 4
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 2 credits base. With `includeReplies`, Include replies. Up to 4 credits max.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Truth Social handle or account id.
        required: true
        description: Truth Social handle or account id.
        name: handle
        in: path
      - schema:
          type: string
          minLength: 1
          description: Opaque pagination cursor from a previous response. Omit for the first page.
        required: false
        description: Opaque pagination cursor from a previous response. Omit for the first page.
        name: cursor
        in: query
      - schema:
          type: boolean
          description: 'When true, includes reply posts in the timeline. Adds 2 credits (4 total including the base lookup). Default: false (top-level posts only).'
        required: false
        description: 'When true, includes reply posts in the timeline. Adds 2 credits (4 total including the base lookup). Default: false (top-level posts only).'
        name: includeReplies
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 20
          description: 'Maximum posts to return (1–20). Default: 20.'
        required: false
        description: 'Maximum posts to return (1–20). Default: 20.'
        name: limit
        in: query
      responses:
        '200':
          description: Truth Social profile posts listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether the profile was found.
                      profile:
                        type:
                        - object
                        - 'null'
                        properties:
                          platform:
                            type: string
                            enum:
                            - truthsocial
                            description: Social platform for this profile.
                          id:
                            type: string
                            pattern: ^\d{1,30}$
                            description: Stable Truth Social account id as a string.
                          handle:
                            type: string
                            minLength: 1
                            description: Truth Social handle without a leading @.
                          displayName:
                            type:
                            - string
                            - 'null'
                            description: Public display name when available.
                          bio:
                            type:
                            - string
                            - 'null'
                            description: Plain-text profile biography.
                          profileUrl:
                            type: string
                            minLength: 1
                            description: Canonical public Truth Social profile URL.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Avatar image URL when publicly available.
                          headerUrl:
                            type:
                            - string
                            - 'null'
                            description: Header/banner image URL when publicly available.
                          websiteUrl:
                            type:
                            - string
                            - 'null'
                            description: Website URL from the profile when publicly safe.
                          location:
                            type:
                            - string
                            - 'null'
                            description: Free-text location when present.
                          createdAt:
                            type:
                            - string
                            - 'null'
                            description: ISO-8601 timestamp when the account was created.
                          lastStatusAt:
                            type:
                            - string
                            - 'null'
                            description: ISO-8601 date of the latest public post when available.
                          isVerified:
                            type: boolean
                            description: Whether the account is marked verified.
                          isLocked:
                            type: boolean
                            description: Whether the account requires follow approval.
                          isBot:
                            type: boolean
                            description: Whether the account is marked as a bot.
                          metrics:
                            type: object
                            properties:
                              followers:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                description: Follower count when available.
                              following:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                description: Following count when available.
                              posts:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                description: Public post count when available.
                            required:
                            - followers
                            - following
                            - posts
                            description: Follower, following, and post counts.
                        required:
                        - platform
                        - id
                        - handle
                        - displayName
                        - bio
                        - profileUrl
                        - avatarUrl
                        - headerUrl
                        - websiteUrl
                        - location
                        - createdAt
                        - lastStatusAt
                        - isVerified
                        - isLocked
                        - isBot
                        - metrics
                        description: Profile when found; null when not found.
                      posts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              pattern: ^\d{1,30}$
