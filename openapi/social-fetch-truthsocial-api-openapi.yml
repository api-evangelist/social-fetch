                                  previewUrl:
                                    type:
                                    - string
                                    - 'null'
                                    description: Preview/thumbnail URL when available.
                                  description:
                                    type:
                                    - string
                                    - 'null'
                                    description: Alt text / description when available.
                                  width:
                                    type:
                                    - integer
                                    - 'null'
                                    minimum: 0
                                    description: Width in pixels when available.
                                  height:
                                    type:
                                    - integer
                                    - 'null'
                                    minimum: 0
                                    description: Height in pixels when available.
                                  durationSeconds:
                                    type:
                                    - number
                                    - 'null'
                                    minimum: 0
