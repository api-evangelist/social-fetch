      operationId: getV1TruthsocialProfilesByHandlePosts
      x-operation-id-source: derived
  /v1/truthsocial/posts:
    get:
      tags:
      - truthsocial
      summary: Get Truth Social post
      description: Get a Truth Social post by URL.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 2
        surcharges: []
        maxCredits: 2
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 2 credits per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: Link to the Truth Social post.
        required: true
        description: Link to the Truth Social post.
        name: url
        in: query
      responses:
        '200':
          description: Truth Social post lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether the post was found.
                      post:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                            pattern: ^\d{1,30}$
                            description: Truth Social status id.
                          url:
                            type: string
                            minLength: 1
                            description: Canonical public Truth Social post URL.
                          createdAt:
                            type:
                            - string
                            - 'null'
                            description: ISO-8601 creation timestamp.
                          editedAt:
                            type:
                            - string
                            - 'null'
                            description: ISO-8601 edit timestamp when available.
                          text:
                            type:
                            - string
                            - 'null'
                            description: Plain-text post body.
                          spoilerText:
                            type:
                            - string
                            - 'null'
                            description: Content warning / spoiler text when present.
                          language:
                            type:
                            - string
                            - 'null'
                            description: Language code when available.
                          visibility:
                            type:
                            - string
                            - 'null'
                            description: Visibility string when available.
                          isSensitive:
                            type: boolean
                            description: Whether the post is marked sensitive.
                          author:
                            type:
                            - object
                            - 'null'
                            properties:
                              platform:
                                type: string
                                enum:
                                - truthsocial
                                description: Social platform for this author.
                              id:
                                type: string
                                pattern: ^\d{1,30}$
                                description: Stable Truth Social account id as a string.
                              handle:
                                type: string
                                minLength: 1
                                description: Truth Social handle without a leading @.
                              displayName:
                                type:
                                - string
                                - 'null'
                                description: Public display name when available.
                              avatarUrl:
                                type:
                                - string
