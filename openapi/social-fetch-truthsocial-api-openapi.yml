                                  description: Canonical public Truth Social profile URL.
                              required:
                              - platform
                              - id
                              - handle
                              - displayName
                              - avatarUrl
                              - isVerified
                              - profileUrl
                              description: Author snapshot when available.
                            inReplyToStatusId:
                              type:
                              - string
                              - 'null'
                              pattern: ^\d{1,30}$
                              description: Parent status id when this is a reply.
                            inReplyToAccountId:
                              type:
