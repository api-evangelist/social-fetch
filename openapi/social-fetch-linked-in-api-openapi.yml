                    - authorProfileUrl: https://www.linkedin.com/in/ingridjohnson?trk=public_post_comment_actor-name
                      authorUserId: ingridjohnson
                      authorName: Ingrid Johnson
                      publishedAt: '2026-05-30T11:17:54.542Z'
                      text: 'You have not been able to build ONE data center for your AI. You start and then as soon as people hear about it they freak out and pressure their government to stop. BlackRock is buying up local farms around these proposed data centers sites to drain underground aquaphors - already strained to extreme levels just for growing crops and providing potable water. No one likes you. Everybody hates your data centers. Because you straight up told them they were going to lose their jobs. Now we have to ask ourselves what this compute is for because large language models are not using the large language model anymore. They’re using something called RAG- it uses zero GPU from data centers and that is now roughly 80% of your customer base . These data centers are for literally nothing. There is no demand. At all. Please take your data centers and build them in your backyard Brad Smith Then Mark Zuckerberg, Elon, Satya, Sam Altman, Dario and his sister? They can build data centers in their yards too You made that error. The only thing you can do about it is crying in your car. I suggest doing that first thing in the morning. You are forgetting something: people vote. And right now? It’s a HARD NO. For every single one.'
