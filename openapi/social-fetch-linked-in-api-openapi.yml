ild the future together!<br><br><strong>WHY WE&apos;RE LOOKING FOR YOU<br><br></strong>Retool started as a way to address obstacles with internal tools and has grown into a company that solves internal tooling for thousands of companies (big and small). We&#x2019;ve done a lot with a little&#x2013;we have a growing engineering team and a laundry list of features and foundational improvements we want to tackle.<br><br>To continue our fast-paced growth, we need to build a world-class engineering team. You&#x2019;ll help us get there by owning end-to-end projects, talking with customers, and ultimately supporting the growth of Retool the product and the business.<br><br><strong>What You&apos;ll Do<br><br></strong>We&#x2019;re a tool built by engineers for engineers. You will work on features that impact thousands of customers globally and have the ability to change how applications are built across all parts of the stack. You&#x2019;ll meet with internal counterparts to enhance customer thinking and partner closely with product on building out features. You&#x2019;ll have a large impact on new features or improve performance on thousands of customers&apos; applications.<br><br>Retool is built primarily in JavaScript and TypeScript, Node.js on the backend, and React on the frontend. We&#x2019;ll look to you to bring your experience to build within this environment and impact our codebase. You&#x2019;ll also engage in technical decision-making with the team, participate in planning, and help our engineering team expand its skillset. To that end, you&#x2019;ll also play a key role in helping us grow the team through interviewing potential new team members.<br><br><strong>Who You&apos;ll Work With<br><br></strong>As an engineer, you will work closely with product and design teams to build, ship, and iterate new features. We&#x2019;re a hard-working, passionate bunch who are motivated by collaboration, strong results, and bringing the impact of Retool to our customers. When we&#x2019;re in the office, we enjoy eating lunch (and occasionally dinner!) together, and we&#x2019;ve been known for our lively game nights. But at the root of it all, we come together to show our customers and not-quite-yet customers how Retool can make them and their companies more efficient and successful. If this sounds like a fit, we&#x2019;d love to hear from you!<br><br><strong>IN THIS ROLE YOU&apos;LL<br><br></strong><ul><li>Improve the UX of the Retool core editor, which involves plenty of interesting problems, both technical (e.g. &quot;how do we implement our drag and drop system in a performant way?&quot;) and otherwise (e.g. &quot;how do we handle the pushing of existing components when dragging new components on?&quot;)</li><li>Expand the types of applications that you can build into different parts of the development process </li><li>Debug customer problems + build features for them (e.g. &quot;the Google Sheets integration doesn&apos;t support adding rows&quot;, and &quot;what&apos;s the best way to support that? Via cell ranges, or via a lightweight, home-grown ORM?&quot;)</li><li>Help assess and recruit future engineers</li><li>Work on increasing the scalability of Retool&#x2019;s platform (e.g. frontend application performance, reducing query latencies) <br><br></li></ul><strong>The Skillset You&apos;ll Bring<br><br></strong><ul><li>3+ years experience in professional software development, ideally some of which you&#x2019;ve spent in startups</li><li>Experience owning technically challenging and demanding cross-functional projects</li><li>Experience across the entire stack, from backend to frontend (and if you have a preference, we&#x2019;d love to hear it!)</li><li>Experience with cloud based infrastructure like Azure, AWS or GCP</li><li>Ability to make technical decisions quickly, while looping in key stakeholders, too</li><li>A customer-first mindset and an interest in talking with customers to make sure what we&#x2019;re building meets their needs</li><li>Habit of introspection and understanding what&#x2019;s helped you be successful in the past<br><br></li></ul><strong>NICE TO HAVE<br><br></strong><ul><li>Experience in JavaScript / TypeScript </li><li>Experience with PostgreSQL </li><li>Bonus points if you have experience in mentoring other team members, and have previously worked closely with designers<br><br></li></ul>For candidates based in the United States, the pay range(s) for this role is listed below and represents base salary range for non-commissionable roles or on-target earnings (OTE) for commissionable roles. This salary range may be inclusive of several career levels at Retool and will be narrowed during the interview process based on a number of factors such as (but not limited to), scope and responsibilities, the candidate&#x2019;s experience and qualifications, and location.<br><br>Additional compensation in the form(s) of equity and/or commission are dependent on the position offered. Retool provides a comprehensive benefit plan, including medical, dental, vision, and 401(k). Pay and benefits are subject to change at any time, consistent with the terms of any applicable compensation or benefit plans.<br><br>The base pay range for this role is $163,800 &#x2013; $306,000 per year.<br><br>Retool offers generous benefits to all employees and hybrid work location. For more information, please visit the benefits and perks section of our careers page!<br><br>Retool is currently set up to employ all roles in the US and specific roles in the UK. To find roles that can be employed in the UK, please refer to our careers page and review the indicated locations.\n        </div>\n\n        \n\n    \n    \n    \n\n    <button class=\"show-more-less-html__button show-more-less-button\n        show-more-less-html__button--more\n        ml-0.5\" data-tracking-control-name=\"public_jobs_show-more-html-btn\" aria-label=\"Show more\" aria-expanded=\"false\">\n<!---->\n        \n            Show more\n          \n\n          <icon class=\"show-more-less-html__button-icon show-more-less-button-icon\" data-delayed-url=\"https://static.licdn.com/aero-v1/sc/h/cyolgscd0imw2ldqppkrb84vo\"></icon>\n    </button>\n  \n\n        \n\n    \n    \n    \n\n    <button class=\"show-more-less-html__button show-more-less-button\n        show-more-less-html__button--less\n        ml-0.5\" data-tracking-control-name=\"public_jobs_show-less-html-btn\" aria-label=\"Show less\" aria-expanded=\"true\">\n<!---->\n        \n            Show less\n          \n\n          <icon class=\"show-more-less-html__button-icon show-more-less-button-icon\" data-delayed-url=\"https://static.licdn.com/aero-v1/sc/h/4chtt12k98xwnba1nimld2oyg\"></icon>\n    </button>\n  \n<!---->    </section>"
