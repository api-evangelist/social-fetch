                    url: https://www.linkedin.com/jobs/view/software-engineer-at-liveramp-4414999672?_l=en
                    title: Software Engineer
                    companyName: LiveRamp
                    companyId: '2241197'
                    companyUrl: https://www.linkedin.com/company/liveramp?trk=public_jobs_topcard-org-name
                    location: San Francisco, CA
                    summary: 'LiveRamp is the data collaboration platform of choice for the world’s most innovative companies. A groundbreaking leader in consumer privacy, data ethics, and foundational identity, LiveRamp is setting the new standard for building a connected customer view with unmatched clarity and context while protecting precious brand and consumer trust. LiveRamp offers complete flexibility to collaborate wherever data lives to support the widest range of data collaboration use cases—within organizations, between brands, and across its premier global network of top-quality partners. Hundreds of global innovators, from iconic consumer brands and tech giants to banks, retailers, and healthcare leaders turn to LiveRamp to build enduring brand and business value by deepening customer engagement and loyalty, activating new partnerships, and maximizing the value of their first-party data while staying on the forefront of rapidly evolving compliance and privacy requirements. You Will Design, develop and maintain scalable software solutions. Own product features from development through production deployment, ensuring scalability, reliability and code quality. Participate in and conduct meaningful code reviews to ensure adherence to engineering standards and best practices. Collaborate with cross-functional teams including product management to deliver robust technical solutions. Participate in Scrum/Agile meetings including sprint planning, daily stand-ups, retrospectives and backlog refinement. Provide operational support for our production systems Foster a positive environment of integrity, empowerment, initiative, and teamwork. Your Team Will The Ingestion team builds & maintains innovative solutions for ingesting data into Liveramp. We receive and process billions of records daily from various sources, validate, anonymize and normalize the data and deliver to downstream systems. About You Bachelor''s degree with 3+ years of relevant experience, or Master''s degree with 1+ year of relevant experience required. Experience with one or more object-oriented programming skills, i.e. Java, Go, C++ Ability to diagnose technical problems, debug code, and automate routine tasks Passion for building large scale systems and writing high-performance code. Enjoy working as part of a distributed team: smart, ethical, friendly, hard-working, and productive Preferred Skills Experience with GCP or another cloud provider (AWS, Azure, ...) The approximate annual base compensation range is $102,000 to $159,000. The actual offer, reflecting the total compensation package and benefits, will be determined by a number of factors including the applicant''s experience, knowledge, skills, and abilities, geography, as well as internal equity among our team. Benefits People: Work with talented, collaborative, and friendly people who love what they do. Fun: We host in-person and virtual events such as game nights, happy hours, camping trips, and sports leagues. Work/Life Harmony: Flexible paid time off, paid holidays, options for working from home, and paid parental leave. Comprehensive Benefits Package: LiveRamp offers a comprehensive benefits package designed to help you be your best self in your personal and professional lives. Our benefits package offers medical, dental, vision, life and disability, an employee assistance program, voluntary benefits as well as perks programs for your healthy lifestyle, career growth and more. Savings: Our 401K matching plan—1:1 match up to 6% of salary—helps you plan ahead. Also Employee Stock Purchase Plan - 15% discount off purchase price of LiveRamp stock (U.S. LiveRampers) More About Us LiveRamp’s mission is to connect data in ways that matter, and doing so starts with our people. We know that inspired teams enlist people from a blend of backgrounds and experiences. And we know that individuals do their best when they not only bring their full selves to work but feel like they truly belong. Connecting LiveRampers to new ideas and one another is one of our guiding principles—one that informs how we hire, train, and grow our global team across nine countries and four continents. Click here to learn more about Diversity, Inclusion, & Belonging (DIB) at LiveRamp. LiveRamp is an affirmative action and equal opportunity employer (AA/EOE/W/M/Vet/Disabled) and does not discriminate in recruiting, hiring, training, promotion or other employment of associates or the awarding of subcontracts because of a person''s race, color, sex, age, religion, national origin, protected veteran, disability, sexual orientation, gender identity, genetics or other protected status. Qualified applicants with arrest and conviction records will be considered for the position in accordance with the San Francisco Fair Chance Ordinance. We use automated decision systems (ADS) as part of our recruitment and hiring process. If you require an accommodation or believe that the use of an ADS may create a barrier to your application or participation in the hiring process due to a disability or other protected characteristic, please let us know. We are committed to providing reasonable accommodations and ensuring an equitable hiring experience for all candidates. California residents : Please see our California Personnel Privacy Policy for more information regarding how we collect, use, and disclose the personal information you provide during the job application process. To all recruitment agencies : LiveRamp does not accept agency resumes. Please do not forward resumes to our jobs alias, LiveRamp employees or any other company location. LiveRamp is not responsible for any fees related to unsolicited resumes. Show more Show less'
