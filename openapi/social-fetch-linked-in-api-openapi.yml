openapi: 3.2.0
info:
  title: Social Fetch Public Linked In API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Linked In
paths:
  /v1/linkedin/profiles:
    get:
      tags:
      - Linked In
      summary: Get LinkedIn profiles
      description: Get LinkedIn person profiles by URL or handle.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 2
        surcharges: []
        maxCredits: 100
        batch:
          maxUnits: 50
          unit: url
      x-socialfetch-credits-pricing: 2 credits per profile URL requested. Up to 50 profiles per request (100 credits max).
      parameters:
      - schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 4096
            description: LinkedIn profile URL, vanity handle, `@handle`, or `in/{handle}` path.
          minItems: 1
          maxItems: 50
          description: LinkedIn profile URL.
        required: true
        description: LinkedIn profile URL.
        name: url
        in: query
      responses:
        '200':
          description: Batch lookup results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              minLength: 1
                              description: Requested profile URL echoed for this result.
                            lookupStatus:
                              type: string
                              enum:
                              - found
                              - not_found
                              - error
                              description: Whether this profile was resolved.
                            error:
                              type:
                              - object
                              - 'null'
                              properties:
                                message:
                                  type: string
                                  minLength: 1
                                  description: Short customer-safe reason this profile could not be returned.
                              required:
                              - message
                              description: Error details when `lookupStatus` is `error`.
                            profile:
                              type:
                              - object
                              - 'null'
                              properties:
                                platform:
                                  type: string
                                  enum:
                                  - linkedin
                                  description: Social platform for this profile.
                                handle:
                                  type: string
                                  description: LinkedIn public profile handle without the leading @.
                                numericId:
                                  type:
                                  - string
                                  - 'null'
                                  description: LinkedIn numeric profile id when available.
                                displayName:
                                  type:
                                  - string
                                  - 'null'
                                  description: Public display name on the profile when available.
                                firstName:
                                  type:
                                  - string
                                  - 'null'
                                  description: First name when available.
                                lastName:
                                  type:
                                  - string
                                  - 'null'
                                  description: Last name when available.
                                headline:
                                  type:
                                  - string
                                  - 'null'
                                  description: Profile headline or position line when available.
                                bio:
                                  type:
                                  - string
                                  - 'null'
                                  description: Profile summary or about text when available.
                                avatarUrl:
                                  type:
                                  - string
                                  - 'null'
                                  description: Best available square avatar image URL when available.
                                bannerUrl:
                                  type:
                                  - string
                                  - 'null'
                                  description: Profile banner image URL when available.
                                profileUrl:
                                  type: string
                                  minLength: 1
                                  description: Canonical public LinkedIn profile URL for this handle.
                                location:
                                  type:
                                  - string
                                  - 'null'
                                  description: Location label when available.
                                city:
                                  type:
                                  - string
                                  - 'null'
                                  description: City label when available.
                                countryCode:
                                  type:
                                  - string
                                  - 'null'
                                  description: ISO country code when available.
                                influencer:
                                  type:
                                  - boolean
                                  - 'null'
                                  description: Whether LinkedIn marks this profile as an influencer.
                                memorialized:
                                  type:
                                  - boolean
                                  - 'null'
                                  description: Whether this is a memorialized account.
                                defaultAvatar:
                                  type:
                                  - boolean
                                  - 'null'
                                  description: Whether the avatar is LinkedIn's default placeholder.
                                currentCompany:
                                  type:
                                  - object
                                  - 'null'
                                  properties:
                                    name:
                                      type:
                                      - string
                                      - 'null'
                                      description: Current company name when available.
                                    companyId:
                                      type:
                                      - string
                                      - 'null'
                                      description: LinkedIn company slug when available.
                                    title:
                                      type:
                                      - string
                                      - 'null'
                                      description: Current role title at the company when available.
                                    url:
                                      type:
                                      - string
                                      - 'null'
                                      description: LinkedIn company URL when available.
                                    location:
                                      type:
                                      - string
                                      - 'null'
                                      description: Current company location label when available.
                                  required:
                                  - name
                                  - companyId
                                  - title
                                  - url
                                  - location
                                  description: Current company details when available.
                                websites:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      title:
                                        type:
                                        - string
                                        - 'null'
                                        description: Website label when available.
                                      url:
                                        type: string
                                        minLength: 1
                                        description: External website URL.
                                    required:
                                    - title
                                    - url
                                    description: External website linked from the profile.
                                  description: External websites linked from the profile.
                                experience:
                                  type: array
                                  items:
                                    type: object
                                    properties:
