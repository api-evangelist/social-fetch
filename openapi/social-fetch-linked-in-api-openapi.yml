                    topVisibleComments:
                    - authorProfileUrl: https://au.linkedin.com/in/ronhulks?trk=public_post_comment_actor-name
                      authorUserId: ronhulks
                      authorName: Ron H.
                      publishedAt: '2026-05-31T07:49:06.970Z'
                      text: This is the part of technology stories people usually skip. The breakthrough gets the spotlight. But the real advantage is usually built much earlier, when the work still looks boring. Power. Land. Trust. Local patience. Operational follow-through. AI will be no different. The visible leap will depend on the invisible system underneath it.
                      taggedProfileUrls: null
                      reactionCount: 2
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://vc.linkedin.com/in/jodie-dennie?trk=public_post_comment_actor-name
                      authorUserId: jodie-dennie
                      authorName: Jodie Dennie
                      publishedAt: '2026-05-30T02:43:04.183Z'
                      text: 'Brad, Rhonda from Idle Hour Restaurant: “people just get in there and help.” That 6-second line explains Quincy’s 20-year arc better than any stat. You broke ground in 2006 on what looked like empty farmland. Today it’s 6x bigger + powering AI. But the video shows the real infrastructure: partnerships, not just servers. Farm town + tech giant building future together. That’s what “thriving future of its own” actually looks like. OST truth: We have Rhondas too. The diner owner, the bus driver, the grandma who “just gets in there and helps” kids for 10 years before anyone notices ROI. Quincy proves infrastructure isn’t steel + fiber first. It’s people showing up for decades. Then the data center follows. Question from youth work: Microsoft measured Quincy’s growth in petabytes + jobs. If you measured “human infrastructure” in a town, what 1 metric would prove a community is building for 20 years, not 2 quarters? Because kids need that same long-game partnership.'
                      taggedProfileUrls: null
                      reactionCount: 2
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://www.linkedin.com/in/marynadeundiak?trk=public_post_comment_actor-name
                      authorUserId: marynadeundiak
                      authorName: Maryna Deundiak, PhD
                      publishedAt: '2026-05-29T21:11:47.348Z'
                      text: Twenty years is long enough to prove that technology isn't the moat. Organizational adaptability is. Most companies survive one technology wave. Very few successfully re-architect themselves for the next one.
                      taggedProfileUrls: null
                      reactionCount: 8
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://www.linkedin.com/in/fabiano-juares-dos-santos-b50036169?trk=public_post_comment_actor-name
                      authorUserId: fabiano-juares-dos-santos-b50036169
                      authorName: Fabiano Juares dos Santos
                      publishedAt: '2026-06-04T03:29:52.686Z'
                      text: The success of a technology ecosystem is measured not only by what it builds, but by the opportunities it creates for the communities around it. A powerful example of long-term partnership and impact
                      taggedProfileUrls: null
                      reactionCount: 1
