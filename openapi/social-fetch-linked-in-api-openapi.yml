                                    - url
                                    - startYear
                                    - endYear
                                    - description
                                    description: One education entry.
                                  description: Education entries when available.
                                languages:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                        minLength: 1
                                        description: Language name.
                                      proficiency:
                                        type:
                                        - string
