                    title: Twenty years ago, Microsoft broke ground on our first data center in Quincy, Washington. At a time when so many small towns have been shrinking, Quincy has grown, and the partnership behind that… | Brad Smith | 52 comments
                    headline: Twenty years ago, Microsoft broke ground on our first data center in Quincy, Washington.
                    text: Twenty years ago, Microsoft broke ground on our first data center in Quincy, Washington. At a time when so many small towns have been shrinking, Quincy has grown, and the partnership behind that story is one worth telling. Watch how a farm town in Central Washington helped build the cloud, and built a thriving future of its own. https://lnkd.in/ePjWhyQu
