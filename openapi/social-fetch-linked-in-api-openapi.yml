                                        description: Proficiency label when available.
                                    required:
                                    - name
                                    - proficiency
                                    description: One language entry.
                                  description: Language entries when available.
                                organizations:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      title:
                                        type: string
                                        minLength: 1
                                        description: Organization name.
                                      membershipType:
                                        type:
                                        - string
                                        - 'null'
                                        description: Membership type or role when available.
                                      startDate:
                                        type:
                                        - string
                                        - 'null'
                                        description: Start date when available.
                                      endDate:
                                        type:
                                        - string
                                        - 'null'
                                        description: End date when available.
                                    required:
