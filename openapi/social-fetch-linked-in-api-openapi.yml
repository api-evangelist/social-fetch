                      text: UX in the public sector is incredibly impactful, just ask Lyndsey. 💥 After upskilling with the Professional Diploma in UX Design, she started creating better experiences for citizens in her local community. By treating citizens as users too, she's making everything from community event planning to park walk-throughs more efficient, thoughtful and intentional. Her story is a great reminder that UX is everywhere, not just in tech companies or digital products. Full story linked in the comments below. 👇
