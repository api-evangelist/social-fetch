                                    - membershipType
                                    - startDate
                                    - endDate
                                    description: One organization membership entry.
                                  description: Organization memberships when available.
                                publications:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      title:
                                        type: string
