                    - authorProfileUrl: https://bd.linkedin.com/in/sazzad-hossain-pme220820?trk=public_post_comment_actor-name
                      authorUserId: sazzad-hossain-pme220820
                      authorName: SAZZAD HOSSAIN
                      publishedAt: '2026-06-03T16:27:59.848Z'
                      text: '🚀 Reimagining Microsoft: Opening the Window to the Future 🚀 I edited a new Microsoft logo with a vision of “opening the window to the future.” The design represents a window expanding outward to explore deeper innovation and next-generation technologies. Each colored panel symbolizes different dimensions of technology — creativity, intelligence, connectivity, and growth. The perspective effect creates the feeling that the window is opening beyond boundaries, reflecting Microsoft’s continuous journey toward AI, cloud computing, and the future digital world. Through this concept, I wanted to keep the iconic identity recognizable while giving it a more futuristic and dynamic expression. Would love to hear feedback from the design community and the team at Microsoft . 🚀 #Microsoft #LogoDesign #BrandIdentity #FutureTechnology #Innovation #AI #GraphicDesign #CreativeDesign #TechVision #LinkedInCreators'
                      taggedProfileUrls: null
                      reactionCount: 0
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://www.linkedin.com/in/ashrafelnashar?trk=public_post_comment_actor-name
                      authorUserId: ashrafelnashar
                      authorName: Dr. Ashraf Elnashar
                      publishedAt: '2026-06-03T01:31:40.226Z'
                      text: 'The shift from app-first to agent-first is the right framing — but it moves the hard problem from the device to the architecture underneath it. When agents act before you ask, the questions that matter are: who authorized that action, what scope did it have, and what happens when it''s wrong? The device layer is Qualcomm''s problem. The identity, permissioning, and audit layer is every enterprise architect''s problem. Project Solara makes that second problem more urgent, not less. Watching how the enterprise security stack evolves around agent-first devices closely.'
                      taggedProfileUrls: null
                      reactionCount: 3
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://www.linkedin.com/in/bhaskargangi?trk=public_post_comment_actor-name
                      authorUserId: bhaskargangi
                      authorName: Bhaskar Gangipamula
                      publishedAt: '2026-06-03T16:38:14.892Z'
                      text: The vertical-to-horizontal argument is the part of this conversation that matters most for enterprise. Every time computing moved to a new form factor, enterprises got stuck managing fragmented, vertical stacks. The open platform bet here means enterprise AI deployment does not have to be rebuilt for every new device context. That is a different starting point than we had with mobile, and it changes how enterprise architects think about agent infrastructure.
                      taggedProfileUrls: null
                      reactionCount: 0
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://in.linkedin.com/in/arijit-ghosh-7363092?trk=public_post_comment_actor-name
                      authorUserId: arijit-ghosh-7363092
                      authorName: Arijit Ghosh
                      publishedAt: '2026-06-02T22:59:33.660Z'
                      text: We spent 30 years building devices for apps. Now we are building devices for agents. The shift sounds technical. It isn't. An app waits to be opened. An agent acts before you ask. That's not a new product. That's a new relationship between humans and machines. 🌏
                      taggedProfileUrls: null
                      reactionCount: 1
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://in.linkedin.com/in/diinesh-bhati-2b188514?trk=public_post_comment_actor-name
                      authorUserId: diinesh-bhati-2b188514
                      authorName: Diinesh Bhati
                      publishedAt: '2026-06-03T03:39:58.429Z'
                      text: 'Project Solara feels like a glimpse into what comes after the app era. For decades, we''ve interacted with software through screens, apps, menus, and clicks. The vision here is fundamentally different: AI agents that understand context, move across devices, and help complete tasks rather than simply launch applications. What stands out is that Microsoft isn''t just building better AI models—it''s rethinking the entire computing stack, from devices and operating systems to agents and enterprise workflows. That''s a much bigger bet than adding AI features to existing products. If the PC era was defined by apps and the mobile era by touch, the next era may be defined by agents that work alongside us across every form factor. Exciting times ahead for builders, developers, and anyone imagining what human-computer interaction looks like beyond the smartphone. 🚀'
                      taggedProfileUrls: null
                      reactionCount: 0
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://in.linkedin.com/company/vishal-show?trk=public_post_comment_actor-name
                      authorUserId: vishal-show
                      authorName: Vishal Show
                      publishedAt: '2026-06-03T10:24:11.244Z'
                      text: The platform plays, but adoption hinges on organizational readiness, not device capability. Agent-centric devices require decision architecture, governance models, and trust frameworks most organizations don't have. The companies extracting value won't be those with better agents. They'll be those that can restructure how decisions actually get made and who controls agent autonomy boundaries.
                      taggedProfileUrls: null
                      reactionCount: 0
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://au.linkedin.com/in/ronhulks?trk=public_post_comment_actor-name
                      authorUserId: ronhulks
                      authorName: Ron H.
                      publishedAt: '2026-06-03T12:14:02.535Z'
                      text: Agent-first devices are a bigger shift than they first look. The screen used to be where humans stayed in control. If agents start working inside the device, that control point moves. Then the hard question is not what the device can do. It is what the agent is allowed to see, decide, and trigger. That is where the real operating risk begins.
                      taggedProfileUrls: null
                      reactionCount: 0
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://uk.linkedin.com/in/aslamsulaimalebbe?trk=public_post_comment_actor-name
                      authorUserId: aslamsulaimalebbe
                      authorName: Aslam Sulaimalebbe, PhD CEng SMIEEE
                      publishedAt: '2026-06-03T11:14:07.600Z'
                      text: A fascinating shift, the technology challenge is no longer just making agents more capable, but making them dependable in real-world environments where context, uncertainty, and consequences matter. as agentic systems move beyond productivity tools and into operational domains, success will increasingly depend on trust, validation, and the ability to demonstrate reliable behaviour under conditions that differ from those seen during development the next platform era may be defined as much by assurance and adoption as by AI capability itself..
                      taggedProfileUrls: null
                      reactionCount: 0
                      authorTitle: null
                      images: null
                    - authorProfileUrl: https://www.linkedin.com/in/opasos?trk=public_post_comment_actor-name
                      authorUserId: opasos
                      authorName: Tessa S.
                      publishedAt: '2026-06-03T14:15:11.209Z'
                      text: 'As hyperscalers deploy agentic AI at scale, enterprises face a new problem: AI systems that can take action without governance. Onpoint Authority Systems, Inc. (OPAS) solves this by providing the authority layer that governs how AI agents operate, ensuring every action is controlled, compliant, and auditable. Let''s connect!'
