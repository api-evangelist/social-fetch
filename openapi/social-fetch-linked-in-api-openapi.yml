                                        type: string
                                        minLength: 1
                                        description: Project title.
                                      startDate:
                                        type:
                                        - string
                                        - 'null'
                                        description: Start date when available.
                                      description:
                                        type:
                                        - string
                                        - 'null'
                                        description: Project description when available.
                                    required:
