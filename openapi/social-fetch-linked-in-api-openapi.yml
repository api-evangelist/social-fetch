                    summary: 'About Retool Nearly every company in the world runs on custom software for critical operations like tracking performance metrics, handling customer support workflows, building admin dashboards, and countless other processes you might not have even thought of. But most companies don''t have adequate resources to properly invest in these tools, leading to a lot of old and clunky internal software or, even worse, users still stuck in manual and spreadsheet flows. At Retool, we’re building the first enterprise AppGen platform: software that transforms natural language into production-ready code, integrates directly with business data, and meets the highest standards of security and governance. AI is redefining what it means to build software—and who gets to build it. The definition of “developer” now includes analysts, operators, and domain experts creating solutions directly. As the pool of builders widens, so does the complexity of what they need to build. The opportunity is enormous, but so is the challenge of enabling this larger community to build production-grade software safely. That means AI that understands real business data, enforces enterprise policies automatically, and empowers teams to create once and reuse everywhere with shared, trusted components. Over 100 million hours of work has been automated by developers and domain experts using our platform, freeing them to focus on creative problem-solving and strategic initiatives that drive real business value. The people closest to knowing what needs to be built can now safely create custom solutions within enterprise guardrails. And that''s a mission worth striving for. Let''s build the future together! WHY WE''RE LOOKING FOR YOU Retool started as a way to address obstacles with internal tools and has grown into a company that solves internal tooling for thousands of companies (big and small). We’ve done a lot with a little–we have a growing engineering team and a laundry list of features and foundational improvements we want to tackle. To continue our fast-paced growth, we need to build a world-class engineering team. You’ll help us get there by owning end-to-end projects, talking with customers, and ultimately supporting the growth of Retool the product and the business. What You''ll Do We’re a tool built by engineers for engineers. You will work on features that impact thousands of customers globally and have the ability to change how applications are built across all parts of the stack. You’ll meet with internal counterparts to enhance customer thinking and partner closely with product on building out features. You’ll have a large impact on new features or improve performance on thousands of customers'' applications. Retool is built primarily in JavaScript and TypeScript, Node.js on the backend, and React on the frontend. We’ll look to you to bring your experience to build within this environment and impact our codebase. You’ll also engage in technical decision-making with the team, participate in planning, and help our engineering team expand its skillset. To that end, you’ll also play a key role in helping us grow the team through interviewing potential new team members. Who You''ll Work With As an engineer, you will work closely with product and design teams to build, ship, and iterate new features. We’re a hard-working, passionate bunch who are motivated by collaboration, strong results, and bringing the impact of Retool to our customers. When we’re in the office, we enjoy eating lunch (and occasionally dinner!) together, and we’ve been known for our lively game nights. But at the root of it all, we come together to show our customers and not-quite-yet customers how Retool can make them and their companies more efficient and successful. If this sounds like a fit, we’d love to hear from you! IN THIS ROLE YOU''LL Improve the UX of the Retool core editor, which involves plenty of interesting problems, both technical (e.g. "how do we implement our drag and drop system in a performant way?") and otherwise (e.g. "how do we handle the pushing of existing components when dragging new components on?") Expand the types of applications that you can build into different parts of the development process Debug customer problems + build features for them (e.g. "the Google Sheets integration doesn''t support adding rows", and "what''s the best way to support that? Via cell ranges, or via a lightweight, home-grown ORM?") Help assess and recruit future engineers Work on increasing the scalability of Retool’s platform (e.g. frontend application performance, reducing query latencies) The Skillset You''ll Bring 3+ years experience in professional software development, ideally some of which you’ve spent in startups Experience owning technically challenging and demanding cross-functional projects Experience across the entire stack, from backend to frontend (and if you have a preference, we’d love to hear it!) Experience with cloud based infrastructure like Azure, AWS or GCP Ability to make technical decisions quickly, while looping in key stakeholders, too A customer-first mindset and an interest in talking with customers to make sure what we’re building meets their needs Habit of introspection and understanding what’s helped you be successful in the past NICE TO HAVE Experience in JavaScript / TypeScript Experience with PostgreSQL Bonus points if you have experience in mentoring other team members, and have previously worked closely with designers For candidates based in the United States, the pay range(s) for this role is listed below and represents base salary range for non-commissionable roles or on-target earnings (OTE) for commissionable roles. This salary range may be inclusive of several career levels at Retool and will be narrowed during the interview process based on a number of factors such as (but not limited to), scope and responsibilities, the candidate’s experience and qualifications, and location. Additional compensation in the form(s) of equity and/or commission are dependent on the position offered. Retool provides a comprehensive benefit plan, including medical, dental, vision, and 401(k). Pay and benefits are subject to change at any time, consistent with the terms of any applicable compensation or benefit plans. The base pay range for this role is $163,800 – $306,000 per year. Retool offers generous benefits to all employees and hybrid work location. For more information, please visit the benefits and perks section of our careers page! Retool is currently set up to employ all roles in the US and specific roles in the UK. To find roles that can be employed in the UK, please refer to our careers page and review the indicated locations. Show more Show less'
