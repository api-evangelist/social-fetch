                      text: A career in UX does not always start with leaving your industry behind. Often, it is about adding a new layer of strategic thinking, problem-solving and user understanding to the work you already do. 🚀 Our latest blog features recent graduates who used UX to evolve their careers in very different ways, from driving product innovation in banking to designing at Apple and improving services within their local communities. Meet them in our latest blog, link in the comments below. 👇
