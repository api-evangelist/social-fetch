                                        type:
                                        - string
                                        - 'null'
                                        description: School or program name when available.
                                      url:
                                        type:
                                        - string
                                        - 'null'
                                        description: School URL when available.
                                      startYear:
                                        type:
                                        - string
                                        - 'null'
                                        description: Start year when available.
                                      endYear:
                                        type:
                                        - string
                                        - 'null'
                                        description: End year when available.
                                      description:
                                        type:
                                        - string
                                        - 'null'
                                        description: Education description when available.
                                    required:
