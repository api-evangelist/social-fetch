  /v1/linkedin/companies/posts:
    get:
      tags:
      - Linked In
      summary: List LinkedIn company posts
      description: List posts from one specific LinkedIn company page by URL (not a keyword search — use linkedin.posts.search.list to search across public posts).
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-agent-hints:
        disambiguation: This endpoint is for LinkedIn company pages only. If you have a school URL or another organization page type, use the Organization page endpoint instead.
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: LinkedIn company page URL or slug whose posts should be listed.
        required: true
        description: LinkedIn company page URL or slug whose posts should be listed.
        name: url
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 7
          description: 1-based results page number. Pagination is page-based; at most 7 pages can be requested for a given company.
        required: false
        description: 1-based results page number. Pagination is page-based; at most 7 pages can be requested for a given company.
        name: page
        in: query
      responses:
