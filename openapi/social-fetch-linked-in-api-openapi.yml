                        publishedAt: '2026-04-06T14:00:23.826Z'
                        text: 'Shopify B2B is now available on more plans.


                          All plans now have access to our key B2B features directly in the admin.


                          The highlights: company profiles, vaulted credit cards, ACH payments, and up to three custom catalogs.


                          https://lnkd.in/gFEPMadg'
                      - id: '7445825000554565632'
                        postUrl: https://www.linkedin.com/posts/shopify_from-biking-and-golf-gear-to-outdoor-furniture-activity-7445825000554565632-tp6T
                        publishedAt: '2026-04-03T13:30:16.844Z'
                        text: 'From biking and golf gear to outdoor furniture, warm weather shaped what US consumers bought in March.


                          We analyzed month-over-month sales from thousands of Shopify merchants to see what was trending. A few highlights:


                          → Lawn and garden season kicked off in a big way. Outdoor misting systems (+302%), sprinklers (+273%), rain barrels (+262%), and weed trimmers (+222%) all saw triple-digit growth.


                          → Backyards got an upgrade, with sunshades (+156%), gazebos (+146%), swing chairs (+130%), and outdoor sofas (+113%) all up. Backyard games, like paddle ball (+92%) and cornhole sets (+46%), were in demand too.


                          → Families geared up for bike season. Child bike seats surged 151%, followed by training wheels (+111%), hybrid bikes (+104%), bicycle baskets (+90%), and helmets (+66%).


                          → Golf season is back. As courses reopen, sales rose for golf club sets (+75%), tees (+51%), and bags (+48%).


                          Entrepreneurs, what trends are you tracking this spring?'
