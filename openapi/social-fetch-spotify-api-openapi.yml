                            description: Artist biography text when available.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Best available square avatar image URL when available.
                          profileUrl:
                            type: string
                            minLength: 1
                            description: Canonical public Spotify artist profile URL.
                          verified:
                            type: boolean
                            description: Whether the artist is marked as verified on Spotify.
                          externalLinks:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  minLength: 1
                                  description: Link label as shown on the artist profile.
                                url:
                                  type: string
                                  minLength: 1
                                  description: Outbound URL for this link.
                              required:
                              - name
                              - url
                              description: External link on a Spotify artist profile.
                            description: Outbound profile links when available.
                        required:
                        - platform
                        - artistId
                        - displayName
                        - bio
                        - avatarUrl
                        - profileUrl
                        - verified
                        description: Artist details when available.
                      metrics:
                        type:
                        - object
                        - 'null'
                        properties:
                          followers:
                            type: integer
                            minimum: 0
                            description: Follower count for the artist.
                          monthlyListeners:
                            type: integer
                            minimum: 0
                            description: Monthly listener count when available.
                          worldRank:
