  /v1/spotify/album:
    get:
      tags:
      - Spotify
      summary: Get Spotify album
      description: Get a Spotify album by id or album URL.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional Spotify album id for the request.
        required: false
        description: Optional Spotify album id for the request.
        name: albumId
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: Optional Spotify album URL for the request.
        required: false
        description: Optional Spotify album URL for the request.
        name: url
        in: query
      responses:
        '200':
          description: Album lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
