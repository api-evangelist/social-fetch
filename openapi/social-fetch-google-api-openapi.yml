                    data:
                      lookupStatus: found
                      ads: []
                      adsEstimate: null
                      page:
                        nextCursor: null
                        hasMore: false
                    meta:
                      requestId: req_01example_empty
                      creditsCharged: 25
                      version: v1
                not_found:
                  value:
                    data:
                      lookupStatus: not_found
                      ads: []
                      adsEstimate: null
                      page:
                        nextCursor: null
                        hasMore: false
                    meta:
                      requestId: req_01example_nf
                      creditsCharged: 25
                      version: v1
