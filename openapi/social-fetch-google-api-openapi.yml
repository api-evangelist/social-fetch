                                regionCode:
                                  type:
                                  - string
                                  - 'null'
                                  description: Two-letter region code when available.
                                regionName:
                                  type:
                                  - string
                                  - 'null'
                                  description: Human-readable region name when available.
                              required:
                              - regionCode
                              - regionName
                              description: Region where a Google Ad Library creative ran.
                            description: Regions where the creative ran.
                          regionStats:
                            type: array
                            items:
                              type: object
                              properties:
                                regionCode:
                                  type:
                                  - string
                                  - 'null'
                                  description: Two-letter region code when available.
                                regionName:
                                  type:
                                  - string
                                  - 'null'
                                  description: Human-readable region name when available.
                                firstShown:
                                  type:
                                  - string
                                  - 'null'
                                  description: ISO-8601 timestamp for when the ad was first shown in this region, when available.
                                lastShown:
                                  type:
                                  - string
                                  - 'null'
                                  description: ISO-8601 timestamp for when the ad was last shown in this region, when available.
                                impressions:
                                  type:
                                  - object
                                  - 'null'
                                  properties:
                                    min:
                                      type:
                                      - integer
                                      - 'null'
                                      minimum: 0
                                      description: Lower bound for impressions when available.
                                    max:
