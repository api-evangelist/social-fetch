openapi: 3.2.0
info:
  title: Social Fetch Public Google API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Google
paths:
  /v1/google/ad-library/companies/ads:
    get:
      tags:
      - Google
      summary: List Google company ads
      description: List ads a company or advertiser is running in Google Ad Transparency.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-agent-hints:
        disambiguation: Google Ad Transparency only includes public ads.
      x-socialfetch-pricing:
        version: 1
        baseCredits: 25
        surcharges: []
        maxCredits: 25
        normalizationFailureCredits: 25
      x-socialfetch-credits-pricing: 25 credits per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: Company domain when you do not have an advertiser id.
        required: false
        description: Company domain when you do not have an advertiser id.
        name: domain
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: Google Ad Transparency advertiser id when you have it instead of a domain.
        required: false
        description: Google Ad Transparency advertiser id when you have it instead of a domain.
        name: advertiserId
        in: query
      - schema:
          type: string
          enum:
          - all
          - political
          description: Optional topic filter. When `political`, `region` is required.
        required: false
        description: Optional topic filter. When `political`, `region` is required.
        name: topic
        in: query
      - schema:
          type: string
          description: Optional region filter as a two-letter country code.
        required: false
        description: Optional region filter as a two-letter country code.
        name: region
        in: query
      - schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Optional start date filter in YYYY-MM-DD format.
        required: false
        description: Optional start date filter in YYYY-MM-DD format.
        name: startDate
        in: query
      - schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Optional end date filter in YYYY-MM-DD format.
        required: false
        description: Optional end date filter in YYYY-MM-DD format.
        name: endDate
        in: query
      - schema:
          type: string
          enum:
          - google_maps
          - google_play
          - google_search
          - google_shopping
          - youtube
          description: Optional Google surface filter.
        required: false
        description: Optional Google surface filter.
        name: platform
        in: query
      - schema:
          type: string
          enum:
          - text
          - image
          - video
          description: Optional creative format filter.
        required: false
        description: Optional creative format filter.
        name: format
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque pagination cursor from a previous response.
        required: false
        description: Opaque pagination cursor from a previous response.
        name: cursor
        in: query
      responses:
        '200':
          description: Ads for the requested company or advertiser.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether the company or advertiser resolved for this request.
                      ads:
                        type: array
                        items:
                          type: object
                          properties:
                            advertiserId:
                              type: string
                              minLength: 1
                              description: Google Ad Transparency advertiser id.
                            creativeId:
                              type: string
                              minLength: 1
                              description: Google Ad Transparency creative id.
                            format:
                              type:
                              - string
                              - 'null'
                              description: Creative format when available (text, image, or video).
                            adUrl:
                              type:
                              - string
                              - 'null'
                              description: Public Google Ad Transparency URL for this creative when available.
                            advertiserName:
                              type:
                              - string
                              - 'null'
                              description: Advertiser display name when available.
                            domain:
                              type:
                              - string
                              - 'null'
                              description: Advertiser domain when available.
                            imageUrl:
                              type:
                              - string
                              - 'null'
                              description: Preview image URL when available.
                            firstShown:
                              type:
                              - string
                              - 'null'
                              description: ISO-8601 timestamp for when the ad was first shown, when available.
                            lastShown:
                              type:
                              - string
                              - 'null'
                              description: ISO-8601 timestamp for when the ad was last shown, when available.
                          required:
                          - advertiserId
                          - creativeId
                          - format
                          - adUrl
                          - advertiserName
                          - domain
                          - imageUrl
                          - firstShown
                          - lastShown
                          description: A single Google Ad Transparency company ad.
                        description: Ads returned for the requested company or advertiser. This array may be empty when the lookup resolves but no ads match the filters.
                      adsEstimate:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        description: Estimated total number of matching ads when reported; otherwise null.
                      page:
                        type: object
                        properties:
                          nextCursor:
                            type:
                            - string
                            - 'null'
                            description: Cursor to pass as `cursor` in the next request when `hasMore` is true; otherwise null.
                          hasMore:
                            type: boolean
                            description: Whether another page of ads can be requested.
                        required:
                        - nextCursor
                        - hasMore
                        description: Pagination information for the current response.
                    required:
                    - lookupStatus
                    - ads
                    - adsEstimate
                    - page
                    description: Endpoint-specific response payload.
