openapi: 3.2.0
info:
  title: Social Fetch Public Facebook API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Facebook
paths:
  /v1/facebook/profiles:
    get:
      tags:
      - Facebook
      summary: Get Facebook profile
      description: Get a Facebook profile or Page by URL or username.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: Facebook public profile or page URL to look up.
        required: true
        description: Facebook public profile or page URL to look up.
        name: url
        in: query
      - schema:
          type: boolean
          description: 'Optional: include structured business hours in the response when available.'
        required: false
        description: 'Optional: include structured business hours in the response when available.'
        name: includeBusinessHours
        in: query
      responses:
        '200':
          description: Facebook profile lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
