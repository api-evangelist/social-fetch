  /v1/facebook/profiles/posts:
    get:
      tags:
      - Facebook
      summary: List Facebook profile posts
      description: List posts from a Facebook profile or Page.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-agent-hints:
        emptyResults: Use `data.lookupStatus` to distinguish `not_found` from `found` with an empty `posts` array (including private or restricted profiles that return no posts).
        disambiguation: Call `GET /v1/facebook/profiles` when you need `private` vs other profile states; this list route only exposes `found` / `not_found`.
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges:
        - queryParam: hostMedia
          credits: 48
          when: boolean_true
          badge: +2 / asset
          label: +2 credits per hosted asset (up to 24)
        maxCredits: 49
        normalizationFailureCredits: 0
      x-socialfetch-credits-pricing: 1 credit base. With `hostMedia`, +2 credits per hosted asset (up to 24 assets, 49 credits max).
      parameters:
      - schema:
          type: string
          minLength: 1
