                            - string
                            - 'null'
                            minLength: 1
                            description: ISO currency code when available.
                          strikethroughFormatted:
                            type:
                            - string
                            - 'null'
                            description: Formatted strikethrough price when available.
                          strikethroughAmount:
                            type:
