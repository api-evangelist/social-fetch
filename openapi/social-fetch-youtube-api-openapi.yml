  /v1/youtube/playlists:
    get:
      tags:
      - Youtube
      summary: Get YouTube playlist
      description: Get a YouTube playlist by playlist id.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: YouTube playlist id, or a YouTube playlist URL (the `list` query value is used when present).
        required: true
        description: YouTube playlist id, or a YouTube playlist URL (the `list` query value is used when present).
        name: playlistId
        in: query
      responses:
        '200':
          description: YouTube playlist lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether the playlist was resolved for this request.
                      playlist:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                            minLength: 1
                            description: YouTube playlist identifier.
                          title:
                            type:
                            - string
                            - 'null'
                            description: Playlist title when available.
                          owner:
                            type:
                            - object
                            - 'null'
                            properties:
                              platform:
                                type: string
                                enum:
                                - youtube
                                description: Social platform for this channel.
                              platformUserId:
                                type:
                                - string
                                - 'null'
                                description: YouTube channel id when available.
                              handle:
                                type:
                                - string
                                - 'null'
                                description: YouTube channel handle without a leading @ when available.
                              displayName:
                                type:
                                - string
                                - 'null'
                                description: Public display name for the playlist owner when available.
                              profileUrl:
                                type:
                                - string
                                - 'null'
                                description: Canonical public YouTube channel URL when available.
                            required:
                            - platform
                            - platformUserId
                            - handle
                            - displayName
                            - profileUrl
                            description: Playlist owner when available.
                          totalVideos:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Reported total number of videos in the playlist when available.
                        required:
                        - id
                        - title
                        - owner
                        - totalVideos
                        description: Playlist summary when found.
                      videos:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              minLength: 1
                              description: YouTube video identifier.
                            title:
                              type:
                              - string
                              - 'null'
                              description: Video title when available.
                            url:
                              type:
                              - string
                              - 'null'
                              description: Canonical public YouTube URL for the video when available.
                            thumbnailUrl:
                              type:
                              - string
                              - 'null'
                              description: Best available thumbnail image URL when available.
                            durationSeconds:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Duration of the video in seconds when available.
                            durationText:
                              type:
                              - string
                              - 'null'
                              description: Human-readable duration label when available.
                            channelTitle:
                              type:
                              - string
                              - 'null'
                              description: Uploader channel title shown for the video when available.
                            channelUrl:
                              type:
                              - string
                              - 'null'
                              description: Uploader channel URL when available.
                          required:
                          - id
                          - title
                          - url
                          - thumbnailUrl
                          - durationSeconds
                          - durationText
                          - channelTitle
                          - channelUrl
                          description: A single video entry in a YouTube playlist.
