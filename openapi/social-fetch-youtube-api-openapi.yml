                              - integer
                              - 'null'
                              minimum: 0
                              description: Duration of the video in milliseconds when available.
                            durationFormatted:
                              type:
                              - string
                              - 'null'
                              description: Alternative formatted duration label when available.
                          required:
                          - id
                          - url
                          - title
                          - thumbnailUrl
                          - viewCount
