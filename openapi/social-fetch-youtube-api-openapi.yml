openapi: 3.2.0
info:
  title: Social Fetch Public You Tube API
  version: 1.0.0
  description: 'REST API for Social Fetch. Versioned routes under `/v1` accept `x-api-key` credits or x402 USDC on Base (walk-up, no key). OpenAPI: https://api.socialfetch.dev/openapi.json. x402 discovery: https://api.socialfetch.dev/.well-known/x402. MCP: https://api.socialfetch.dev/mcp (POST). Docs and agent guide: https://www.socialfetch.dev/docs and https://www.socialfetch.dev/llms.txt.'
servers:
- url: https://api.socialfetch.dev
  description: API origin
tags:
- name: Youtube
paths:
  /v1/youtube/channel:
    get:
      tags:
      - Youtube
      summary: Get YouTube channel
      description: Get YouTube channel details by channel id, handle, or URL.
      security:
      - ApiKeyAuth: []
      - {}
      x-socialfetch-pricing:
        version: 1
        baseCredits: 1
        surcharges: []
        maxCredits: 1
        normalizationFailureCredits: 1
      x-socialfetch-credits-pricing: 1 credit per successful request.
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: Optional YouTube channel id for the request.
        required: false
        description: Optional YouTube channel id for the request.
        name: channelId
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional YouTube channel handle for the request.
        required: false
        description: Optional YouTube channel handle for the request.
        name: handle
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 4096
          description: Optional YouTube channel URL for the request.
        required: false
        description: Optional YouTube channel URL for the request.
        name: url
        in: query
      responses:
        '200':
          description: YouTube channel lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookupStatus:
                        type: string
                        enum:
                        - found
                        - not_found
                        description: Whether the channel was found.
                      channel:
                        type:
                        - object
                        - 'null'
                        properties:
                          platform:
                            type: string
                            enum:
                            - youtube
                            description: Social platform for this channel.
                          handle:
                            type: string
                            description: YouTube channel handle without the leading @.
                          displayName:
                            type:
                            - string
                            - 'null'
                            description: Public display name for the YouTube channel.
                          bio:
                            type:
                            - string
                            - 'null'
                            description: Channel description text when available.
                          avatarUrl:
                            type:
                            - string
                            - 'null'
                            description: Best available square avatar image URL.
                          bannerUrl:
                            type:
                            - string
                            - 'null'
                            description: Channel banner image URL when available.
                          verified:
                            type: boolean
                            description: Whether the channel is marked as verified.
                          profileUrl:
                            type: string
                            minLength: 1
                            description: Canonical public YouTube channel URL.
                          platformUserId:
                            type: string
                            description: YouTube channel id (stable identifier for the channel).
                          country:
                            type:
                            - string
                            - 'null'
                            description: Country label when available.
                          joinedDateText:
                            type:
                            - string
                            - 'null'
                            description: Human-readable join date text from YouTube when available (not guaranteed to parse to a calendar date).
                          externalLinks:
                            type: array
                            items:
                              type: string
                              minLength: 1
                            description: Deduplicated outbound links associated with the channel when available.
                        required:
                        - platform
                        - handle
                        - displayName
                        - bio
                        - avatarUrl
                        - bannerUrl
                        - verified
                        - profileUrl
                        description: Channel details when available.
                      metrics:
                        type:
                        - object
                        - 'null'
                        properties:
                          subscribers:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Subscriber count for the channel when available.
                          videos:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Public video count for the channel when available.
                          views:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Total view count reported for the channel when available.
                        required:
                        - subscribers
                        - videos
                        - views
                        description: Channel metrics when available.
                    required:
                    - lookupStatus
                    - channel
                    - metrics
                    description: Endpoint-specific response payload.
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        minLength: 1
                        description: Unique request identifier for tracing this API call.
                      creditsCharged:
                        type: integer
                        minimum: 0
                        description: Credits charged for this request.
                      version:
                        type: string
                        enum:
                        - v1
                        description: Public API version that served the response.
                      cached:
                        type: boolean
                        description: True when served from shared response cache. Credits still apply (full endpoint price); Age header may be present.
                    required:
                    - requestId
                    - creditsCharged
                    - version
                    description: Metadata describing the request and billing outcome.
                required:
                - data
                - meta
                description: Standard success response envelope.
              examples:
                found:
                  value:
                    data:
                      lookupStatus: found
                      channel:
                        platform: youtube
                        handle: MrBeast
                        displayName: MrBeast
                        bio: 'SUBSCRIBE FOR A COOKIE!

                          New MrBeast or MrBeast Gaming video every single Saturday at noon eastern time!

                          Accomplishments:

                          - Raised $20,000,000 To Plant 20,000,000 Trees

                          - Removed 30,000,000 pounds of trash from the ocean

                          - Helped 2,000 people walk again

                          - Helped 1,000 blind people see

                          - Helped 1,000 deaf people hear

                          - Built wells in Africa

                          - Built and gave away 100 houses

                          - Adopted every dog in a shelter (twice)

                          - Given millions to charity

                          - Started my own snack company Feastables

                          - Started my own software company Viewstats

                          - Gave away a private island (twice)

                          - Gave away 1 million meals

                          - I counted to 100k

                          - Ran a marathon in the world''s largest shoes

                          - Survived 50 hours in Antarctica

                          - Recreated Squid Game in real life

                          - Created the largest competition show with 1000 people (Beast Games)

                          - Gave $5,000,000 to one person

                          you get it, I appreciate all of you so much :)


                          Terms & Conditions of Current Sweepstakes: https://bit.ly/mrbeastbowandarrow'
                        avatarUrl: https://yt3.googleusercontent.com/nxYrc_1_2f77DoBadyxMTmv7ZpRZapHR5jbuYe7PlPd5cIRJxtNNEYyOC0ZsxaDyJJzXrnJiuDE=s68-c-k-c0x00ffffff-no-rj
                        bannerUrl: https://yt3.googleusercontent.com/mHMO_eEMp0dPvh0ADwXhPXNYb_GnjSVsLI8biqF1CpxT8OPl7izhNQsDPD3JHhd5y5Mg9GrP=w2560-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj
                        verified: true
                        profileUrl: http://www.youtube.com/@MrBeast
                        platformUserId: UCX6OQ3DkcsbYNE6H8uQQuVA
                        country: United States
                        joinedDateText: Joined Feb 19, 2012
                        externalLinks:
                        - https://facebook.com/mrbeast
                        - https://instagram.com/mrbeast
                        - https://twitter.com/MrBeast
                      metrics:
                        subscribers: 486000000
                        videos: 979
                        views: 122602383901
                    meta:
                      requestId: req_d407d134-bab9-4ea6-bb12-f85a6a78e078
                      creditsCharged: 1
                      version: v1
                not_found:
                  value:
                    data:
                      lookupStatus: not_found
                      channel: null
                      metrics: null
                    meta:
                      requestId: req_01example_nf
                      creditsCharged: 1
                      version: v1
